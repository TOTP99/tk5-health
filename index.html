    日志会自动记录 BLE、C1、C3、AE02、心率以及所有 YCBT 原始数据。
    不需要手动复制几十行内容。

<script>
"use strict";
/* =========================================================
   UUID
========================================================= */
const HR_SERVICE =
  "0000180d-0000-1000-8000-00805f9b34fb";
const HR_MEASUREMENT =
  "00002a37-0000-1000-8000-00805f9b34fb";
const YCBT_SERVICE =
  "be940000-7333-be46-b7ae-689e71722bd5";
const C1_UUID =
  "be940001-7333-be46-b7ae-689e71722bd5";
const C3_UUID =
  "be940003-7333-be46-b7ae-689e71722bd5";
const JL_SERVICE =
  "0000ae00-0000-1000-8000-00805f9b34fb";
const JL_WRITE =
  "0000ae01-0000-1000-8000-00805f9b34fb";
const JL_NOTIFY =
  "0000ae02-0000-1000-8000-00805f9b34fb";
/* =========================================================
   Global
========================================================= */
let device = null;
let server = null;
let hrChar = null;
let c1Char = null;
let c3Char = null;
let jlWriteChar = null;
let jlNotifyChar = null;
let c1Buffer = new Uint8Array(0);
let c3Buffer = new Uint8Array(0);
let keepaliveTimer = null;
let keepaliveCounter = 0;
let logLines = [];
let handshakeRunning = false;
/* =========================================================
   UI
========================================================= */
const $ = id => document.getElementById(id);
function setStatus(text){
  $("status").textContent = text;
}
function nowString(){
  const d = new Date();
  return d.toLocaleTimeString("zh-CN", {
    hour12:false
  }) + "." +
    String(d.getMilliseconds()).padStart(3,"0");
}
function hex(data){
  return Array.from(data)
    .map(x => x.toString(16).padStart(2,"0"))
    .join(" ");
}
function hexCompact(data){
  return Array.from(data)
    .map(x => x.toString(16).padStart(2,"0"))
    .join("");
}
function log(text){
  const line =
    "[" + nowString() + "] " + text;
  logLines.push(line);
  $("log").textContent =
    logLines.join("\n");
  $("log").scrollTop =
    $("log").scrollHeight;
  console.log(line);
}
/* =========================================================
   Array helpers
========================================================= */
function concatUint8(a,b){
  const out =
    new Uint8Array(a.length + b.length);
  out.set(a,0);
  out.set(b,a.length);
  return out;
}
/* =========================================================
   CRC16
   YCBT / Open-RingBridge compatible
========================================================= */
function crc16(data){
  let s = 0xffff;
  for(let i=0;i<data.length;i++){
    s =
      (((s << 8) & 0xff00) |
       ((s >> 8) & 0x00ff)) ^
      data[i];
    s ^= (s & 0xff) >> 4;
    s ^= (s << 12) & 0xffff;
    s ^= ((s & 0xff) << 5) & 0xffff;
  }
  return s & 0xffff;
}
/* =========================================================
   YCBT packet
========================================================= */
function makePacket(type,payload=[]){
  const totalLength =
    4 + payload.length + 2;
  const p =
    new Uint8Array(totalLength);
  p[0] = (type >> 8) & 0xff;
  p[1] = type & 0xff;
  p[2] = totalLength & 0xff;
  p[3] = (totalLength >> 8) & 0xff;
  p.set(payload,4);
  const crc =
    crc16(p.slice(0,4 + payload.length));
  p[totalLength-2] =
    crc & 0xff;
  p[totalLength-1] =
    (crc >> 8) & 0xff;
  return p;
}
/* =========================================================
   Time payload
========================================================= */
function makeTimePayload(){
  const d = new Date();
  const year = d.getFullYear();
  return new Uint8Array([
    year & 0xff,
    (year >> 8) & 0xff,
    d.getMonth() + 1,
    d.getDate(),
    d.getHours(),
    d.getMinutes(),
    d.getSeconds(),
    d.getDay() === 0 ? 6 : d.getDay() - 1
  ]);
}
/* =========================================================
   Send command
========================================================= */
async function sendYCBT(type,payload=[]){
  if(!c1Char){
    log("ERROR: C1 不可用");
    return false;
  }
  const packet =
    makePacket(type,payload);
  log(
    "TX C1 0x" +
    type.toString(16).padStart(4,"0") +
    " [" +
    hex(packet) +
    "]"
  );
  try{
    if(c1Char.properties.writeWithoutResponse){
      await c1Char.writeValueWithoutResponse(packet);
    }else{
      await c1Char.writeValue(packet);
    }
    return true;
  }catch(e){
    log(
      "TX ERROR 0x" +
      type.toString(16) +
      " : " +
      e.message
    );
    return false;
  }
}
/* =========================================================
   Parse packet stream
========================================================= */
function parseStream(kind,data){
  if(kind === "C1"){
    c1Buffer =
      concatUint8(c1Buffer,data);
    c1Buffer =
      parseBufferedPackets(
        "C1",
        c1Buffer
      );
  }else{
    c3Buffer =
      concatUint8(c3Buffer,data);
    c3Buffer =
      parseBufferedPackets(
        "C3",
        c3Buffer
      );
  }
}
function parseBufferedPackets(kind,buffer){
  while(buffer.length >= 4){
    const totalLength =
      buffer[2] |
      (buffer[3] << 8);
    if(totalLength < 6){
      log(
        "WARN " + kind +
        " 非法长度 " +
        totalLength +
        "，丢弃1字节"
      );
      buffer =
        buffer.slice(1);
      continue;
    }
    if(buffer.length < totalLength){
      break;
    }
    const packet =
      buffer.slice(0,totalLength);
    buffer =
      buffer.slice(totalLength);
    handleYCBTPacket(kind,packet);
  }
  return buffer;
}
/* =========================================================
   YCBT packet handler
========================================================= */
function handleYCBTPacket(kind,p){
  const type =
    (p[0] << 8) |
    p[1];
  const length =
    p[2] |
    (p[3] << 8);
  const payload =
    p.slice(4,p.length - 2);
  const receivedCRC =
    p[p.length-2] |
    (p[p.length-1] << 8);
  const calculatedCRC =
    crc16(p.slice(0,p.length-2));
  const crcOK =
    receivedCRC === calculatedCRC;
  log(
    "RX " + kind +
    " 0x" +
    type.toString(16).padStart(4,"0") +
    " len=" +
    length +
    " crc=" +
    (crcOK ? "OK" : "BAD") +
    " payload=[" +
    hex(payload) +
    "]"
  );
  if(!crcOK){
    log(
      "WARN CRC mismatch: received=" +
      receivedCRC.toString(16) +
      " calculated=" +
      calculatedCRC.toString(16)
    );
  }
  parseYCBT(type,payload);
}
/* =========================================================
   YCBT parser
========================================================= */
function parseYCBT(type,p){
  switch(type){
    /* ---------------------------------------------
       Device Info
    --------------------------------------------- */
    case 0x0200:
      log(
        "INFO 0200 payload length=" +
        p.length
      );
      if(p.length > 5){
        const battery = p[5];
        if(battery >= 0 && battery <= 100){
          $("battery").textContent =
            battery;
          log(
            "🔋 Battery = " +
            battery +
            "%"
          );
        }
      }
      $("deviceInfo").textContent =
        "收到 DeviceInfo 0x0200；" +
        "payload=" + hex(p);
      break;
    /* ---------------------------------------------
       Chip Scheme
    --------------------------------------------- */
    case 0x021b:
      log(
        "CHIP SCHEME 0x021B = [" +
        hex(p) +
        "]"
      );
      break;
    /* ---------------------------------------------
       Steps
    --------------------------------------------- */
    case 0x020c:
      if(p.length >= 2){
        const steps =
          p[0] |
          (p[1] << 8);
        $("steps").textContent =
          steps;
        log(
          "👣 Steps 020C = " +
          steps
        );
      }
      break;
    /* ---------------------------------------------
       Power
    --------------------------------------------- */
    case 0x0225:
      log(
        "POWER STATS = [" +
        hex(p) +
        "]"
      );
      break;
    /* ---------------------------------------------
       Heart
    --------------------------------------------- */
    case 0x0601:
      if(p.length >= 1){
        const hr = p[0];
        if(hr > 0 && hr < 250){
          $("hr").textContent =
            hr;
          log(
            "❤️ HR 0601 = " +
            hr
          );
        }
      }
      break;
    /* ---------------------------------------------
       SpO2
    --------------------------------------------- */
    case 0x0602:
      if(p.length >= 1){
        const spo2 = p[0];
        if(spo2 > 0 && spo2 <= 100){
          $("spo2").textContent =
            spo2;
          log(
            "🩸 SpO2 0602 = " +
            spo2 +
            "%"
          );
        }
      }
      break;
    /* ---------------------------------------------
       Blood / BP
    --------------------------------------------- */
    case 0x0603:
      if(p.length >= 3){
        const sbp = p[0];
        const dbp = p[1];
        const hr  = p[2];
        log(
          "BP 0603 = " +
          sbp + "/" +
          dbp +
          " HR=" +
          hr
        );
        if(hr > 0 && hr < 250){
          $("hr").textContent =
            hr;
        }
        if(p.length >= 5){
          const spo2 =
            p[4];
          if(spo2 > 0 && spo2 <= 100){
            $("spo2").textContent =
              spo2;
          }
        }
      }
      break;
    /* ---------------------------------------------
       Comprehensive realtime data
    --------------------------------------------- */
    case 0x060a:
      if(p.length >= 8){
        const steps =
          p[0] |
          (p[1] << 8) |
          (p[2] << 16);
        const distance =
          p[3] |
          (p[4] << 8);
        const calories =
          p[5] |
          (p[6] << 8);
        const hr =
          p[7];
        log(
          "060A realtime: " +
          "steps=" + steps +
          " distance=" + distance +
          " calories=" + calories +
          " HR=" + hr
        );
        if(steps > 0){
          $("steps").textContent =
            steps;
        }
        if(hr > 0 && hr < 250){
          $("hr").textContent =
            hr;
        }
      }
      if(p.length >= 11){
        const spo2 =
          p[10];
        if(spo2 > 0 && spo2 <= 100){
          $("spo2").textContent =
            spo2;
          log(
            "🩸 060A SpO2 = " +
            spo2 +
            "%"
          );
        }
      }
      if(p.length >= 15){
        log(
          "060A wearing=" +
          p[14]
        );
      }
      if(p.length >= 16){
        if(p[15] > 0 && p[15] <= 100){
          log(
            "060A battery=" +
            p[15]
          );
        }
      }
      break;
    /* ---------------------------------------------
       Wearing
    --------------------------------------------- */
    case 0x0613:
      if(p.length >= 5){
        log(
          "WEARING = " +
          (p[4] ? "worn" : "not worn")
        );
      }
      break;
    /* ---------------------------------------------
       Keepalive
    --------------------------------------------- */
    case 0x032f:
      log(
        "KEEPALIVE RX [" +
        hex(p) +
        "]"
      );
      break;
    /* ---------------------------------------------
       History transfer done
    --------------------------------------------- */
    case 0x0580:
      log(
        "HISTORY TRANSFER DONE [" +
        hex(p) +
        "]"
      );
      break;
    default:
      log(
        "UNHANDLED YCBT 0x" +
        type.toString(16).padStart(4,"0")
      );
      break;
  }
}
/* =========================================================
   Standard HR
========================================================= */
function handleHR(event){
  const d =
    event.target.value;
  if(d.byteLength < 2)
    return;
  const flags =
    d.getUint8(0);
  let hr;
  if(flags & 0x01){
    hr =
      d.getUint16(1,true);
  }else{
    hr =
      d.getUint8(1);
  }
  if(hr > 0 && hr < 250){
    $("hr").textContent =
      hr;
    log(
      "❤️ HR 2A37 = " +
      hr
    );
  }
}
/* =========================================================
   Notification handlers
========================================================= */
function onC1(event){
  const data =
    new Uint8Array(
      event.target.value.buffer
    );
  log(
    "RAW C1 [" +
    hex(data) +
    "]"
  );
  parseStream("C1",data);
}
function onC3(event){
  const data =
    new Uint8Array(
      event.target.value.buffer
    );
  log(
    "RAW C3 [" +
    hex(data) +
    "]"
  );
  parseStream("C3",data);
}
function onJL(event){
  const data =
    new Uint8Array(
      event.target.value.buffer
    );
  log(
    "RAW AE02 [" +
    hex(data) +
    "]"
  );
}
/* =========================================================
   Subscribe
========================================================= */
async function subscribeAll(){
  log("开始订阅 BLE 通知...");
  /* Standard HR */
  try{
    hrChar =
      await server.getPrimaryService(
        HR_SERVICE
      ).then(
        s => s.getCharacteristic(
          HR_MEASUREMENT
        )
      );
    await hrChar.startNotifications();
    hrChar.addEventListener(
      "characteristicvaluechanged",
      handleHR
    );
    log("OK: 2A37 HR subscribed");
  }catch(e){
    log(
      "WARN: HR service unavailable: " +
      e.message
    );
  }
  /* YCBT */
  try{
    const svc =
      await server.getPrimaryService(
        YCBT_SERVICE
      );
    c1Char =
      await svc.getCharacteristic(
        C1_UUID
      );
    c3Char =
      await svc.getCharacteristic(
        C3_UUID
      );
    await c1Char.startNotifications();
    c1Char.addEventListener(
      "characteristicvaluechanged",
      onC1
    );
    log("OK: C1 subscribed");
    await c3Char.startNotifications();
    c3Char.addEventListener(
      "characteristicvaluechanged",
      onC3
    );
    log("OK: C3 subscribed");
  }catch(e){
    log(
      "ERROR YCBT subscribe: " +
      e.message
    );
    throw e;
  }
  /* JieLi */
  try{
    const svc =
      await server.getPrimaryService(
        JL_SERVICE
      );
    jlWriteChar =
      await svc.getCharacteristic(
        JL_WRITE
      );
    jlNotifyChar =
      await svc.getCharacteristic(
        JL_NOTIFY
      );
    await jlNotifyChar.startNotifications();
    jlNotifyChar.addEventListener(
      "characteristicvaluechanged",
      onJL
    );
    log("OK: AE02 subscribed");
  }catch(e){
    log(
      "WARN: AE02 unavailable: " +
      e.message
    );
  }
}
/* =========================================================
   Handshake
========================================================= */
async function handshake(){
  if(handshakeRunning)
    return;
  handshakeRunning = true;
  try{
    log("========== HANDSHAKE START ==========");
    /* 1 */
    await sendYCBT(
      0x0201,
      [0x47,0x46]
    );
    await sleep(500);
    /* 2 */
    await sendYCBT(
      0x0100,
      makeTimePayload()
    );
    await sleep(500);
    /* 3 */
    await sendYCBT(
      0x021b,
      []
    );
    await sleep(500);
    /* 4 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    /*
      Important:
      Give JieLi authentication time.
    */
    log(
      "等待 AE02 / JieLi authentication 4 秒..."
    );
    await sleep(4000);
    /* 5 */
    await sendYCBT(
      0x021b,
      []
    );
    await sleep(500);
    /* 6 */
    await sendYCBT(
      0x0203,
      [0x47,0x50]
    );
    await sleep(500);
    /* 7 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    await sleep(500);
    /* 8 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    await sleep(500);
    /* 9 STOP */
    await sendYCBT(
      0x0309,
      [0x00,0x00,0x02,0x90]
    );
    await sleep(500);
    /* 10 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    await sleep(500);
    /* 11 */
    await sendYCBT(
      0x0109,
      [0x00,0x00,0x31,0x37]
    );
    await sleep(500);
    /* 12 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    await sleep(500);
    /* 13 HR background */
    await sendYCBT(
      0x010c,
      [0x01,0x05]
    );
    await sleep(500);
    /* 14 SpO2 background */
    await sendYCBT(
      0x0126,
      [0x01,0x05]
    );
    await sleep(500);
    /* 15 */
    await sendYCBT(
      0x0200,
      [0x47,0x43]
    );
    await sleep(500);
    /* 16 Steps */
    await sendYCBT(
      0x020c,
      []
    );
    await sleep(700);
    /* 17 Battery */
    await sendYCBT(
      0x0225,
      []
    );
    await sleep(700);
    /* 18 Keepalive */
    await sendYCBT(
      0x032f,
      [0x01,0x00]
    );
    await sleep(1000);
    /* 20 START realtime */
    await sendYCBT(
      0x0309,
      [0x01,0x00,0x02,0xa0]
    );
    log(
      "========== HANDSHAKE COMPLETE =========="
    );
    startKeepalive();
  }catch(e){
    log(
      "HANDSHAKE ERROR: " +
      e.message
    );
  }finally{
    handshakeRunning = false;
  }
}
/* =========================================================
   Keepalive
========================================================= */
function startKeepalive(){
  stopKeepalive();
  keepaliveCounter = 0;
  keepaliveTimer =
    setInterval(async()=>{
      if(!c1Char)
        return;
      const counter =
        keepaliveCounter & 0xff;
      await sendYCBT(
        0x032f,
        [0x01,counter]
      );
      keepaliveCounter =
        (keepaliveCounter + 1) & 0xff;
    },30000);
  log(
    "Keepalive started: 30 sec"
  );
}
function stopKeepalive(){
  if(keepaliveTimer){
    clearInterval(
      keepaliveTimer
    );
    keepaliveTimer = null;
  }
}
/* =========================================================
   Connect
========================================================= */
async function connect(){
  if(!navigator.bluetooth){
    alert(
      "当前浏览器不支持 Web Bluetooth。\n请使用 Bluefy。"
    );
    return;
  }
  try{
    setStatus(
      "正在选择 TK5..."
    );
    log("requestDevice...");
    device =
      await navigator.bluetooth.requestDevice({
        filters:[
          {
            namePrefix:"TK5"
          }
        ],
        optionalServices:[
          HR_SERVICE,
          YCBT_SERVICE,
          JL_SERVICE
        ]
      });
    log(
      "DEVICE: " +
      (device.name || "(unknown)") +
      " id=" +
      device.id
    );
    device.addEventListener(
      "gattserverdisconnected",
      onDisconnected
    );
    setStatus(
      "已选择 " +
      (device.name || "TK5") +
      "，正在连接..."
    );
    server =
      await device.gatt.connect();
    log("GATT connected");
    setStatus(
      "已连接 " +
      (device.name || "TK5")
    );
    $("deviceInfo").textContent =
      "设备：" +
      (device.name || "TK5") +
      "\nID：" +
      device.id;
    await subscribeAll();
    /*
      Wait a moment after subscriptions.
    */
    await sleep(500);
    await handshake();
  }catch(e){
    log(
      "CONNECT ERROR: " +
      e.name +
      " / " +
      e.message
    );
    setStatus(
      "连接失败：" +
      e.message
    );
  }
}
/* =========================================================
   Disconnect
========================================================= */
async function disconnect(){
  stopKeepalive();
  try{
    if(device && device.gatt.connected){
      device.gatt.disconnect();
      log("GATT disconnected");
    }
  }catch(e){
    log(
      "Disconnect error: " +
      e.message
    );
  }
  setStatus("已断开");
}
function onDisconnected(){
  stopKeepalive();
  log("EVENT: GATT disconnected");
  setStatus("设备已断开");
}
/* =========================================================
   Utilities
========================================================= */
function sleep(ms){
  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}
/* =========================================================
   Copy log
========================================================= */
$("copyBtn").addEventListener(
  "click",
  async()=>{
    const text =
      logLines.join("\n");
    try{
      await navigator.clipboard.writeText(
        text
      );
      alert(
        "全部日志已经复制。"
      );
    }catch(e){
      /*
        Clipboard API may be unavailable
        on some Bluefy configurations.
      */
      const ta =
        document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      alert(
        "全部日志已经复制。"
      );
    }
  }
);
/* =========================================================
   Download log
========================================================= */
$("downloadBtn").addEventListener(
  "click",
  ()=>{
    const text =
      logLines.join("\n");
    const blob =
      new Blob(
        [text],
        {
          type:"text/plain;charset=utf-8"
        }
      );
    const url =
      URL.createObjectURL(blob);
    const a =
      document.createElement("a");
    const timestamp =
      new Date()
      .toISOString()
      .replace(/[:.]/g,"-");
    a.href = url;
    a.download =
      "TK5-52F5-debug-" +
      timestamp +
      ".txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(
      ()=>URL.revokeObjectURL(url),
      1000
    );
    log(
      "日志文件已生成"
    );
  }
);
/* =========================================================
   Clear log
========================================================= */
$("clearBtn").addEventListener(
  "click",
  ()=>{
    logLines = [];
    $("log").textContent = "";
  }
);
/* =========================================================
   Buttons
========================================================= */
$("connectBtn").addEventListener(
  "click",
  connect
);
$("disconnectBtn").addEventListener(
  "click",
  disconnect
);
/* =========================================================
   Initial
========================================================= */
log(
  "TK5 Health v0.3.1 ready"
);
log(
  "等待连接 TK5 52F5..."
);
</script>
