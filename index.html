<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<title>TK5 Health</title>
<style>
:root{
  --bg:#060b10;
  --panel:#0b151e;
  --panel2:#101f29;
  --gold:#d5b46a;
  --gold-dim:#705d35;
  --cyan:#67d8df;
  --cyan-dim:#295f65;
  --text:#edf5f7;
  --muted:#8da1aa;
  --line:#29404b;
  --ok:#73d6ad;
  --warn:#e0bb68;
  --danger:#ff7777;
  --shadow:rgba(0,0,0,.5);
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html{
  background:var(--bg);
}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(
      circle at 18% 0%,
      #1b3543 0,
      #0b1720 31%,
      #060b10 75%
    );
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(35px,env(safe-area-inset-bottom));
}
main{
  width:100%;
  max-width:820px;
  margin:auto;
}
header,
.card{
  position:relative;
  border:1px solid var(--gold-dim);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(18,32,43,.98),
      rgba(7,14,20,.99)
    );
  box-shadow:
    0 18px 45px var(--shadow),
    inset 0 1px rgba(255,255,255,.045);
}
header{
  padding:18px;
  margin-bottom:12px;
  overflow:hidden;
}
header:before,
.card:before{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
  opacity:.45;
}
h1{
  margin:0;
  font-size:26px;
  letter-spacing:.6px;
}
h2{
  margin:0 0 13px;
  font-size:15px;
  letter-spacing:1px;
  color:var(--gold);
}
.sub{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}
.status{
  margin-top:14px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#061219;
  color:var(--cyan);
  font-size:13px;
}
.card{
  padding:15px;
  margin:12px 0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.metric{
  position:relative;
  min-height:115px;
  padding:13px;
  overflow:hidden;
  border:1px solid #35505b;
  border-radius:13px;
  background:
    linear-gradient(
      145deg,
      #142833,
      #09141c
    );
  box-shadow:
    inset 0 1px rgba(255,255,255,.035),
    0 8px 20px rgba(0,0,0,.22);
}
.metric:after{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  bottom:0;
  height:1px;
  background:
    linear-gradient(
      90deg,
      transparent,
      var(--gold),
      transparent
    );
  opacity:.35;
}
.label{
  color:var(--muted);
  font-size:12px;
}
.value{
  margin:10px 0 4px;
  font-size:30px;
  line-height:1;
  font-weight:700;
}
.unit{
  color:var(--muted);
  font-size:11px;
}
.row{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}
button{
  min-height:42px;
  padding:10px 13px;
  border:1px solid #806b3e;
  border-radius:11px;
  background:
    linear-gradient(
      145deg,
      #172832,
      #0d1a22
    );
  color:var(--text);
  font-size:14px;
  box-shadow:
    inset 0 1px rgba(255,255,255,.055),
    0 4px 13px rgba(0,0,0,.2);
}
button:active{
  transform:translateY(1px);
  filter:brightness(1.15);
}
button.primary{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      #826c3d,
      #4c4025
    );
}
button.cyan{
  border-color:#397d83;
  background:
    linear-gradient(
      135deg,
      #15383e,
      #0c2228
    );
}
button.danger{
  border-color:#713f3f;
  color:#ffdada;
}
button:disabled{
  opacity:.45;
}
.small{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.device-line{
  padding:8px 0;
  border-bottom:1px solid #1c3039;
}
.device-line:last-child{
  border-bottom:0;
}
.badge{
  display:inline-block;
  padding:3px 7px;
  margin-left:5px;
  border:1px solid #39565f;
  border-radius:999px;
  color:var(--cyan);
  font-size:10px;
}
.good{
  color:var(--ok);
}
.warn{
  color:var(--warn);
}
.error{
  color:var(--danger);
}
.history-status{
  margin-top:12px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#071119;
  font-size:12px;
}
.history{
  max-height:430px;
  overflow:auto;
  margin-top:10px;
  border-top:1px solid #1d3038;
}
.record{
  padding:9px 0;
  border-bottom:1px solid #1c2d35;
  font-size:11px;
  line-height:1.5;
  word-break:break-all;
}
.record-title{
  color:var(--gold);
  font-weight:600;
}
.raw{
  color:#8bbdc1;
}
#log{
  min-height:90px;
  max-height:370px;
  overflow:auto;
  margin-top:10px;
  padding:10px;
  border:1px solid #24343b;
  border-radius:10px;
  background:#020608;
  color:#9fe8d0;
  white-space:pre-wrap;
  word-break:break-all;
  font:
    11px/1.45
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    monospace;
}
.progress{
  height:5px;
  margin-top:10px;
  overflow:hidden;
  border-radius:99px;
  background:#0b1a21;
}
.progress-bar{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      var(--gold-dim),
      var(--gold),
      var(--cyan)
    );
  transition:width .25s ease;
}
@media(max-width:430px){
  body{
    padding-left:9px;
    padding-right:9px;
  }
  .card,
  header{
    border-radius:15px;
  }
  .grid{
    gap:7px;
  }
  .value{
    font-size:27px;
  }
  button{
    padding:9px 10px;
    font-size:13px;
  }
}
</style>
</head>
<body>
<main>
<header>

<!-- =====================================================

====================================================== -->
<section class="card">
  <h2>历史数据</h2>
  <div class="row">
    <button data-history="02">
      活动
    </button>
    <button data-history="04">

<!-- =====================================================
     DEVICE
====================================================== -->
<section class="card">

<!-- =====================================================
     EXPORT
====================================================== -->
<section class="card">
  <h2>本地数据</h2>

</main>
<script>
"use strict";
/* =========================================================
   CONFIG
========================================================= */
const YCBT_SERVICE =
  "be940000-7333-be46-b7ae-689e71722bd5";
const C1_UUID =
  "be940001-7333-be46-b7ae-689e71722bd5";
const C3_UUID =
  "be940003-7333-be46-b7ae-689e71722bd5";
const DEVICE_NAME =
  "TK5 52F5";
/*
 * History query key -> response data key
 *
 * Query:
 * 05 02 -> activity
 * 05 04 -> sleep
 * 05 06 -> HR
 * 05 08 -> BP
 * 05 09 -> all
 * 05 1A -> SpO2
 * 05 1E -> temperature
 * 05 2F -> comprehensive
 * 05 33 -> body data
 */
const HISTORY_DATA_KEYS = {
  0x02:0x11,
  0x04:0x13,
  0x06:0x15,
  0x08:0x17,
  0x09:0x18,
  0x1a:0x22,
  0x1e:0x26,
  0x2f:0x30,
  0x33:0x34
};
/* =========================================================
   STATE
========================================================= */
let device = null;
let server = null;
let c1 = null;
let c3 = null;
let c1Buffer =
  new Uint8Array();
let c3Buffer =
  new Uint8Array();
let logs = [];
let records =
  loadRecords();
/*
 * History state machine
 */
let historySession = {
  active:false,
  key:null,
  dataKey:null,
  startedAt:0,
  header:null,
  dataPackets:0,
  dataBytes:0,
  rawBytes:[],
  terminal:false,
  timeout:null
};
/*
 * Measurement state
 */
let measurement = {
  active:false,
  mode:null,
  startedAt:0,
  timer:null
};
/* =========================================================
   DOM
========================================================= */
const $ = id =>
  document.getElementById(id);
/* =========================================================
   LOG
========================================================= */
function log(text){
  const time =
    new Date()
      .toLocaleTimeString(
        "zh-CN",
        {
          hour12:false
        }
      );
  const line =
    "[" +
    time +
    "] " +
    text;
  logs.push(line);
  if(
    logs.length > 5000
  ){
    logs =
      logs.slice(
        -5000
      );
  }
  $("log").textContent =
    logs.join("\n");
  $("log").scrollTop =
    $("log").scrollHeight;
  console.log(line);
}
/* =========================================================
   STATUS
========================================================= */
function setStatus(text){
  $("status")
    .textContent =
    text;
}
/* =========================================================
   HEX
========================================================= */
function hex(data){
  return Array.from(data)
    .map(
      n =>
        n
          .toString(16)
          .padStart(2,"0")
    )
    .join(" ");
}
/* =========================================================
   CONCAT
========================================================= */
function concatBytes(a,b){
  const result =
    new Uint8Array(
      a.length +
      b.length
    );
  result.set(
    a,
    0
  );
  result.set(
    b,
    a.length
  );
  return result;
}
/* =========================================================
   CRC16 CCITT-FALSE
========================================================= */
function crc16(data){
  let crc =
    0xffff;
  for(
    let i=0;
    i<data.length;
    i++
  ){
    crc ^=
      data[i] << 8;
    for(
      let j=0;
      j<8;
      j++
    ){
      if(
        crc & 0x8000
      ){
        crc =
          (
            (crc << 1) ^
            0x1021
          ) & 0xffff;
      }else{
        crc =
          (crc << 1) &
          0xffff;
      }
    }
  }
  return crc;
}
/* =========================================================
   PACKET
========================================================= */
function makePacket(
  type,
  payload=[]
){
  const total =
    6 +
    payload.length;
  const out =
    new Uint8Array(
      total
    );
  out[0] =
    (type >> 8) & 0xff;
  out[1] =
    type & 0xff;
  out[2] =
    total & 0xff;
  out[3] =
    (total >> 8) & 0xff;
  out.set(
    payload,
    4
  );
  const crc =
    crc16(
      out.slice(
        0,
        total - 2
      )
    );
  out[
    total - 2
  ] =
    crc & 0xff;
  out[
    total - 1
  ] =
    (crc >> 8) & 0xff;
  return out;
}
/* =========================================================
   SEND
========================================================= */
async function sendYCBT(
  type,
  payload=[]
){
  if(!c1){
    log(
      "ERROR: C1 not connected"
    );
    return false;
  }
  const packet =
    makePacket(
      type,
      payload
    );
  log(
    "TX C1 0x" +
    type
      .toString(16)
      .padStart(4,"0") +
    " [" +
    hex(packet) +
    "]"
  );
  try{
    /*
     * iOS Bluefy / Web Bluetooth:
     * prefer writeWithoutResponse.
     */
    if(
      c1.properties &&
      c1.properties.writeWithoutResponse &&
      c1.writeValueWithoutResponse
    ){
      await c1
        .writeValueWithoutResponse(
          packet
        );
    }else{
      await c1
        .writeValue(
          packet
        );
    }
    return true;
  }catch(error){
    log(
      "TX ERROR: " +
      error.message
    );
    return false;
  }
}
/* =========================================================
   CLOCK
========================================================= */
function makeClockPayload(){
  const d =
    new Date();
  const year =
    d.getFullYear();
  /*
   * YCBT local clock
   */
  return [
    year & 0xff,
    (year >> 8) & 0xff,
    d.getMonth() + 1,
    d.getDate(),
    d.getHours(),
    d.getMinutes(),
    d.getSeconds(),
    d.getDay() === 0
      ? 6
      : d.getDay() - 1
  ];
}
/* =========================================================
   STREAM REASSEMBLY
========================================================= */
function consumeStream(
  channel,
  incoming
){
  let buffer =
    channel === "C1"
      ? c1Buffer
      : c3Buffer;
  buffer =
    concatBytes(
      buffer,
      new Uint8Array(
        incoming
      )
    );
  while(
    buffer.length >= 4
  ){
    const declaredLength =
      buffer[2] |
      (buffer[3] << 8);
    /*
     * YCBT frame:
     * minimum:
     * 4 header + 2 CRC
     */
    if(
      declaredLength < 6
    ){
      log(
        "WARN " +
        channel +
        " invalid frame length=" +
        declaredLength
      );
      buffer =
        buffer.slice(1);
      continue;
    }
    /*
     * Wait for complete frame.
     */
    if(
      buffer.length <
      declaredLength
    ){
      break;
    }
    const packet =
      buffer.slice(
        0,
        declaredLength
      );
    buffer =
      buffer.slice(
        declaredLength
      );
    handlePacket(
      channel,
      packet
    );
  }
  if(
    channel === "C1"
  ){
    c1Buffer =
      buffer;
  }else{
    c3Buffer =
      buffer;
  }
}
/* =========================================================
   PACKET HANDLER
========================================================= */
function handlePacket(
  channel,
  packet
){
  if(
    packet.length < 6
  ){
    return;
  }
  const type =
    (packet[0] << 8) |
    packet[1];
  const declaredLength =
    packet[2] |
    (packet[3] << 8);
  const payload =
    packet.slice(
      4,
      packet.length - 2
    );
  const rxCRC =
    packet[
      packet.length - 2
    ] |
    (
      packet[
        packet.length - 1
      ] << 8
    );
  const calcCRC =
    crc16(
      packet.slice(
        0,
        packet.length - 2
      )
    );
  const crcOK =
    rxCRC ===
    calcCRC;
  log(
    "RX " +
    channel +
    " 0x" +
    type
      .toString(16)
      .padStart(4,"0") +
    " len=" +
    declaredLength +
    " crc=" +
    (
      crcOK
        ? "OK"
        : "BAD"
    ) +
    " payload=[" +
    hex(payload) +
    "]"
  );
  if(!crcOK){
    log(
      "WARN CRC mismatch " +
      "rx=0x" +
      rxCRC.toString(16) +
      " calc=0x" +
      calcCRC.toString(16)
    );
  }
  parsePacket(
    type,
    payload
  );
}
/* =========================================================
   PARSER
========================================================= */
function parsePacket(
  type,
  p
){
  switch(type){
    /* ==========================================
       DEVICE INFO
    ========================================== */
    case 0x0200:
      parseDeviceInfo(p);
      break;
    /* ==========================================
       SUPPORT
    ========================================== */
    case 0x0201:
      log(
        "Support Function [" +
        hex(p) +
        "]"
      );
      break;
    /* ==========================================
       DEVICE NAME
    ========================================== */
    case 0x0203:
      parseDeviceName(p);
      break;
    /* ==========================================
       CHIP
    ========================================== */
    case 0x021b:
      log(
        "Chip Scheme [" +
        hex(p) +
        "]"
      );
      break;
    /* ==========================================
       STEPS
    ========================================== */
    case 0x020c:
      parseSteps(p);
      break;
    /* ==========================================
       POWER
    ========================================== */
    case 0x0225:
      log(
        "Power Stats [" +
        hex(p) +
        "]"
      );
      break;
    /* ==========================================
       MEASUREMENT RESPONSE
    ========================================== */
    case 0x032f:
      parseMeasurementCommandResponse(p);
      break;
    /* ==========================================
       REALTIME STATUS
    ========================================== */
    case 0x0600:
      parseRealtimeStatus(p);
      break;
    /* ==========================================
       REALTIME HR
    ========================================== */
    case 0x0601:
      parseRealtimeHR(p);
      break;
    /* ==========================================
       REALTIME SPO2
    ========================================== */
    case 0x0602:
      parseRealtimeSpO2(p);
      break;
    /* ==========================================
       REALTIME VITALS
    ========================================== */
    case 0x0603:
      parseRealtimeVitals(p);
      break;
    /* ==========================================
       WEARING
    ========================================== */
    case 0x0613:
      log(
        "Wearing status [" +
        hex(p) +
        "]"
      );
      break;
    /* ==========================================
       BATTERY PUSH
    ========================================== */
    case 0x0615:
      if(
        p.length
      ){
        updateBattery(
          p[0]
        );
      }
      break;
    /* ==========================================
       DEVICE EVENT
    ========================================== */
    case 0x040e:
      log(
        "Device Event [" +
        hex(p) +
        "]"
      );
      addRecord(
        "device-event",
        {
          raw:
            hex(p)
        }
      );
      break;
    /* ==========================================
       HISTORY HEADER / STATUS / DATA
    ========================================== */
    default:
      if(
        isHistoryPacket(
          type
        )
      ){
        parseHistoryPacket(
          type,
          p
        );
      }else{
        log(
          "UNHANDLED 0x" +
          type
            .toString(16)
            .padStart(4,"0") +
          " payload=[" +
          hex(p) +
          "]"
        );
      }
      break;
  }
}

/* =========================================================
   REALTIME VITALS
========================================================= */
function parseRealtimeVitals(p){
  /*
   * IMPORTANT:
   *
   * Do NOT assume these values are mmHg,
   * HRV, stress, etc. yet.
   *
   * We preserve all bytes so the actual
   * TK5 can be decoded from samples.
   */
  const candidate16 = [];
  const candidate32 = [];
  for(
    let i=0;
    i+1<p.length;
    i+=2
  ){
    candidate16.push(
      p[i] |
      (p[i+1] << 8)
    );
  }
  for(
    let i=0;
    i+3<p.length;
    i+=4
  ){
    candidate32.push(
      (
        p[i] |
        (p[i+1] << 8) |
        (p[i+2] << 16) |
        (p[i+3] << 24)
      ) >>> 0
    );
  }
  log(
    "0603 VITALS raw=[" +
    hex(p) +
    "] " +
    "u16=[" +
    candidate16.join(",") +
    "]"
  );
  addRecord(
    "vitals-0603",
    {
      raw:
        hex(p),
      u16:
        candidate16,
      u32:
        candidate32
    }
  );
  updateMeasurementStatus(
    "BP/HRV",
    "收到 0603 原始数据"
  );
}

/* =========================================================
   HISTORY PACKETS
========================================================= */
function isHistoryPacket(
  type
){
  return (
    HISTORY_DATA_KEYS[
      historySession.key
    ] === type
    ||
    type === 0x0580
    ||
    (
      type >= 0x0500 &&
      type <= 0x0534
    )
  );
}
/* =========================================================
   HISTORY PARSER
========================================================= */
function parseHistoryPacket(
  type,
  p
){
  /*
   * If no active session,
   * still log the packet instead
   * of silently throwing it away.
   */
  if(
    !historySession.active
  ){
    log(
      "History packet without active session: " +
      "0x" +
      type
        .toString(16)
        .padStart(4,"0") +
      " [" +
      hex(p) +
      "]"
    );
    return;
  }
  const key =
    historySession.key;
  const expectedDataKey =
    HISTORY_DATA_KEYS[key];
  /* =========================================
     QUERY RESPONSE / STATUS
  ========================================= */
  if(
    type ===
    (
      0x0500 |
      key
    )
  ){
    parseHistoryQueryResponse(
      key,
      p
    );
    return;
  }
  /* =========================================
     DATA
  ========================================= */
  if(
    type === expectedDataKey
  ){
    historySession
      .dataPackets++;
    historySession
      .dataBytes +=
      p.length;
    for(
      const byte of p
    ){
      historySession
        .rawBytes
        .push(byte);
    }
    log(
      "HISTORY DATA key=" +
      keyToHex(key) +
      " packet#" +
      historySession.dataPackets +
      " bytes=" +
      p.length +
      " total=" +
      historySession.dataBytes
    );
    addRecord(
      "history-data",
      {
        queryKey:
          keyToHex(key),
        dataType:
          keyToHex(expectedDataKey),
        packet:
          historySession.dataPackets,
        raw:
          hex(p)
      }
    );
    updateHistoryProgress();
    return;
  }
  /* =========================================
     TERMINAL
  ========================================= */
  if(
    type === 0x0580
  ){
    handleHistoryTerminal(
      p
    );
    return;
  }
  /*
   * Unknown history-related packet.
   */
  log(
    "HISTORY UNKNOWN type=0x" +
    type
      .toString(16)
      .padStart(4,"0") +
    " [" +
    hex(p) +
    "]"
  );
}
/* =========================================================
   HISTORY QUERY RESPONSE
========================================================= */
function parseHistoryQueryResponse(
  key,
  p
){
  /*
   * Your current ring returns:
   *
   * 0509 [00 00]
   * 0508 [00 00]
   * 0504 [00 00]
   *
   * These are now treated as a status response,
   * not an "unhandled" packet.
   */
  if(
    p.length === 2 &&
    p[0] === 0 &&
    p[1] === 0
  ){
    log(
      "HISTORY STATUS key=" +
      keyToHex(key) +
      " => 00 00"
    );
    setHistoryStatus(
      "设备返回 00 00：当前没有继续的数据流，等待确认"
    );
    /*
     * IMPORTANT:
     *
     * Do NOT immediately retry.
     * Do NOT leave the session locked forever.
     *
     * Some TK5 firmware returns 00 00
     * when there are no records or when
     * the selected record group is empty.
     */
    scheduleHistoryResolve(
      key,
      4000
    );
    return;
  }
  /*
   * Single status byte, e.g.
   *
   * 052F [FC]
   */
  if(
    p.length === 1
  ){
    const status =
      p[0];
    log(
      "HISTORY STATUS key=" +
      keyToHex(key) +
      " code=0x" +
      status
        .toString(16)
        .padStart(2,"0")
    );
    if(
      status === 0xfc
    ){
      setHistoryStatus(
        "设备返回 FC：该历史类型当前不可用/无数据"
      );
    }else{
      setHistoryStatus(
        "设备状态：0x" +
        status
          .toString(16)
          .padStart(2,"0")
      );
    }
    scheduleHistoryResolve(
      key,
      2500
    );
    return;
  }
  /*
   * Standard history header:
   *
   * recordCount:u16
   * totalPackets:u32
   * totalBytes:u32
   *
   * little endian
   */
  if(
    p.length >= 10
  ){
    const recordCount =
      p[0] |
      (p[1] << 8);
    const totalPackets =
      readU32LE(
        p,
        2
      );
    const totalBytes =
      readU32LE(
        p,
        6
      );
    historySession.header = {
      recordCount:
        recordCount,
      totalPackets:
        totalPackets,
      totalBytes:
        totalBytes
    };
    log(
      "HISTORY HEADER key=" +
      keyToHex(key) +
      " records=" +
      recordCount +
      " packets=" +
      totalPackets +
      " bytes=" +
      totalBytes
    );
    setHistoryStatus(
      "历史数据：" +
      recordCount +
      " 条，" +
      totalBytes +
      " bytes"
    );
    updateHistoryProgress();
    return;
  }
  /*
   * Any other query response is retained.
   */
  log(
    "HISTORY QUERY RESPONSE key=" +
    keyToHex(key) +
    " [" +
    hex(p) +
    "]"
  );
}
/* =========================================================
   HISTORY TERMINAL
========================================================= */
async function handleHistoryTerminal(
  p
){
  if(
    historySession.terminal
  ){
    return;
  }
  historySession.terminal =
    true;
  log(
    "HISTORY TERMINAL 0580 [" +
    hex(p) +
    "]"
  );
  setHistoryStatus(
    "收到历史 terminal，正在 ACK…"
  );
  /*
   * Protocol:
   *
   * 05 80 00
   *
   * The actual YCBT frame is:
   *
   * type=0x0580
   * payload=[00]
   */
  const sent =
    await sendYCBT(
      0x0580,
      [0x00]
    );
  if(sent){
    log(
      "HISTORY TERMINAL ACK sent: 05 80 [00]"
    );
  }
  setHistoryStatus(
    "历史同步完成："
    +
    historySession.dataPackets
    +
    " packets / "
    +
    historySession.dataBytes
    +
    " bytes"
  );
  finishHistorySession(
    true
  );
}
/* =========================================================
   HISTORY START
========================================================= */
async function queryHistory(
  keyHex
){
  const key =
    parseInt(
      keyHex,
      16
    );
  if(
    !HISTORY_DATA_KEYS[key]
  ){
    log(
      "ERROR unsupported history key=" +
      keyHex
    );
    return;
  }
  /*
   * One history session at a time.
   */
  if(
    historySession.active
  ){
    log(
      "WARN: history session already active " +
      "key=" +
      keyToHex(
        historySession.key
      )
    );
    setHistoryStatus(
      "已有历史同步进行中，请等待完成"
    );
    return;
  }
  resetHistorySession();
  historySession.active =
    true;
  historySession.key =
    key;
  historySession.dataKey =
    HISTORY_DATA_KEYS[key];
  historySession.startedAt =
    Date.now();
  setHistoryStatus(
    "正在读取历史 " +
    keyToHex(key) +
    "…"
  );
  $("historyProgress")
    .style.width =
    "0%";
  log(
    "HISTORY START key=" +
    keyToHex(key)
  );
  const sent =
    await sendYCBT(
      0x0500 | key
    );
  if(!sent){
    finishHistorySession(
      false
    );
    return;
  }
  /*
   * Give the ring enough time.
   *
   * We use a long timeout because
   * sleep/all-history can be much larger.
   */
  historySession.timeout =
    setTimeout(
      () => {
        if(
          !historySession.active
        ){
          return;
        }
        log(
          "WARN: history timeout key=" +
          keyToHex(key) +
          " packets=" +
          historySession.dataPackets +
          " bytes=" +
          historySession.dataBytes
        );
        setHistoryStatus(
          "历史查询超时，已释放查询锁"
        );
        finishHistorySession(
          false
        );
      },
      30000
    );
}
/* =========================================================
   HISTORY DELAYED RESOLVE
========================================================= */
function scheduleHistoryResolve(
  key,
  delay
){
  /*
   * Do not resolve if data starts arriving.
   */
  setTimeout(
    () => {
      if(
        !historySession.active
      ){
        return;
      }
      if(
        historySession.key !==
        key
      ){
        return;
      }
      if(
        historySession.dataPackets > 0
      ){
        return;
      }
      /*
       * No data and no terminal:
       * this firmware appears to have returned
       * an empty/status response.
       */
      setHistoryStatus(
        "设备未返回历史数据"
      );
      log(
        "HISTORY END key=" +
        keyToHex(key) +
        " without data"
      );
      finishHistorySession(
        false
      );
    },
    delay
  );
}
/* =========================================================
   HISTORY RESET
========================================================= */
function resetHistorySession(){
  if(
    historySession.timeout
  ){
    clearTimeout(
      historySession.timeout
    );
  }
  historySession = {
    active:false,
    key:null,
    dataKey:null,
    startedAt:0,
    header:null,
    dataPackets:0,
    dataBytes:0,
    rawBytes:[],
    terminal:false,
    timeout:null
  };
}
/* =========================================================
   HISTORY FINISH
========================================================= */
function finishHistorySession(
  success
){
  if(
    historySession.timeout
  ){
    clearTimeout(
      historySession.timeout
    );
  }
  /*
   * Save one summary record.
   */
  if(
    historySession.key !== null
  ){
    addRecord(
      "history-session",
      {
        key:
          keyToHex(
            historySession.key
          ),
        success:
          success,
        packets:
          historySession.dataPackets,
        bytes:
          historySession.dataBytes,
        header:
          historySession.header
      }
    );
  }
  $("historyProgress")
    .style.width =
    success
      ? "100%"
      : "0%";
  const old =
    historySession;
  resetHistorySession();
  /*
   * Keep final status.
   */
  if(success){
    setHistoryStatus(
      "完成 · " +
      old.dataPackets +
      " packets · " +
      old.dataBytes +
      " bytes"
    );
  }
}
/* =========================================================
   HISTORY PROGRESS
========================================================= */
function updateHistoryProgress(){
  if(
    !historySession.active
  ){
    return;
  }
  const header =
    historySession.header;
  if(
    !header
  ){
    return;
  }
  let percent =
    0;
  if(
    header.totalBytes > 0
  ){
    percent =
      Math.min(
        100,
        (
          historySession.dataBytes /
          header.totalBytes
        ) * 100
      );
  }else if(
    header.totalPackets > 0
  ){
    percent =
      Math.min(
        100,
        (
          historySession.dataPackets /
          header.totalPackets
        ) * 100
      );
  }
  $("historyProgress")
    .style.width =
    percent.toFixed(1) +
    "%";
}
/* =========================================================
   READ UINT32
========================================================= */
function readU32LE(
  p,
  offset
){
  if(
    offset + 4 >
    p.length
  ){
    return 0;
  }
  return (
    p[offset] |
    (p[offset+1] << 8) |
    (p[offset+2] << 16) |
    (p[offset+3] << 24)
  ) >>> 0;
}
/* =========================================================
   KEY
========================================================= */
function keyToHex(
  n
){
  return n
    .toString(16)
    .padStart(2,"0")
    .toUpperCase();
}
/* =========================================================
   MEASUREMENT
========================================================= */
async function startMeasurement(
  mode
){
  if(!c1){
    log(
      "ERROR: 请先连接戒指"
    );
    return;
  }
  stopMeasurementTimer();
  const names = {
    0:"HR",
    1:"BP",
    2:"SpO₂",
    10:"HRV"
  };
  measurement.active =
    true;
  measurement.mode =
    mode;
  measurement.startedAt =
    Date.now();
  const name =
    names[mode] ||
    "0x" +
    mode.toString(16);
  $("measureStatus")
    .textContent =
    "正在测量 " +
    name +
    "…";
  log(
    "MEASUREMENT START mode=0x" +
    mode
      .toString(16)
      .padStart(2,"0")
  );
  const ok =
    await sendYCBT(
      0x032f,
      [
        0x01,
        mode
      ]
    );
  if(!ok){
    stopMeasurementTimer();
    return;
  }
  /*
   * Some measurements need time.
   * Automatically stop after 90 seconds.
   */
  measurement.timer =
    setTimeout(
      () => {
        log(
          "Measurement timeout; sending stop"
        );
        stopMeasurement();
      },
      90000
    );
}
/* =========================================================
   STOP MEASUREMENT
========================================================= */
async function stopMeasurement(){
  stopMeasurementTimer();
  if(!c1){
    measurement.active =
      false;
    return;
  }
  const mode =
    measurement.mode;
  log(
    "MEASUREMENT STOP"
  );
  await sendYCBT(
    0x032f,
    [
      0x00,
      0x00
    ]
  );
  measurement.active =
    false;
  measurement.mode =
    null;
  $("measureStatus")
    .textContent =
    "测量已停止";
}

function stopMeasurementTimer(){

/* =========================================================
   CONNECT
========================================================= */
async function connect(){
  try{
    if(
      !navigator.bluetooth
    ){
      throw new Error(
        "当前浏览器不支持 Web Bluetooth，请使用 Bluefy"
      );
    }
    setStatus(
      "正在选择 TK5…"
    );
    /*
     * Exact device name.
     *
     * optionalServices is required because
     * the service is not a standard service.
     */
    device =
      await navigator.bluetooth
        .requestDevice({
          filters:[
            {
              name:
                DEVICE_NAME
            }
          ],
          optionalServices:[
            YCBT_SERVICE
          ]
        });
    log(
      "Selected: " +
      (
        device.name ||
        "unknown"
      )
    );
    server =
      await device.gatt.connect();
    log(
      "GATT connected"
    );
    const service =
      await server
        .getPrimaryService(
          YCBT_SERVICE
        );
    c1 =
      await service
        .getCharacteristic(
          C1_UUID
        );
    c3 =
      await service
        .getCharacteristic(
          C3_UUID
        );
    c1Buffer =
      new Uint8Array();
    c3Buffer =
      new Uint8Array();
    c1.addEventListener(
      "characteristicvaluechanged",
      event => {
        consumeStream(
          "C1",
          event.target
            .value
            .buffer
        );
      }
    );
    c3.addEventListener(
      "characteristicvaluechanged",
      event => {
        consumeStream(
          "C3",
          event.target
            .value
            .buffer
        );
      }
    );
    await c1
      .startNotifications();
    log(
      "C1 notifications subscribed"
    );
    await c3
      .startNotifications();
    log(
      "C3 notifications subscribed"
    );
    device.addEventListener(
      "gattserverdisconnected",
      onDisconnected
    );
    setStatus(
      "已连接 · " +
      (
        device.name ||
        DEVICE_NAME
      )
    );
    $("device").innerHTML =
      '<div class="device-line">' +
        '<span class="small">Bluetooth：</span>' +
        escapeHTML(
          device.name ||
          DEVICE_NAME
        ) +
      '</div>' +
      '<div class="device-line small">' +
        'YCBT service connected' +
      '</div>';
    /*
     * ========================================
     * VERIFIED TK5 INITIALIZATION
     * ========================================
     */
    /*
     * Support function
     */
    await sendYCBT(
      0x0201,
      [
        0x47,
        0x46
      ]
    );
    /*
     * Set clock
     */
    await sendYCBT(
      0x0100,
      makeClockPayload()
    );
    /*
     * Chip scheme
     */
    await sendYCBT(
      0x021b
    );
    /*
     * Device info
     */
    await sendYCBT(
      0x0200
    );
    /*
     * Device name
     */
    await sendYCBT(
      0x0203
    );
    /*
     * Steps
     */
    await sendYCBT(
      0x020c
    );
    /*
     * Start realtime status
     */
    await sendYCBT(
      0x0309,
      [
        0x01,
        0x00,
        0x02,
        0xA0
      ]
    );
    /*
     * Start HR
     */
    await sendYCBT(
      0x032f,
      [
        0x01,
        0x00
      ]
    );
    log(
      "TK5 initialization complete"
    );
  }catch(error){
    log(
      "CONNECT ERROR: " +
      error.message
    );
    setStatus(
      "连接失败：" +
      error.message
    );
  }
}
/* =========================================================
   DISCONNECT
========================================================= */
function disconnect(){
  try{
    stopMeasurementTimer();
    if(
      device &&
      device.gatt &&
      device.gatt.connected
    ){
      device.gatt.disconnect();
    }else{
      onDisconnected();
    }
  }catch(error){
    log(
      "Disconnect error: " +
      error.message
    );
  }
}
/* =========================================================
   DISCONNECTED
========================================================= */
function onDisconnected(){
  c1 = null;
  c3 = null;
  server = null;
  stopMeasurementTimer();
  measurement.active =
    false;
  if(
    historySession.active
  ){
    log(
      "History aborted because GATT disconnected"
    );
    resetHistorySession();
  }
  setStatus(
    "已断开"
  );
  $("measureStatus")
    .textContent =
    "未连接";
  log(
    "GATT disconnected"
  );
}
/* =========================================================
   RECORD STORAGE
========================================================= */
function loadRecords(){
  try{
    const raw =
      localStorage.getItem(
        "tk5Records"
      );
    if(!raw){
      return [];
    }
    const parsed =
      JSON.parse(raw);
    return Array.isArray(
      parsed
    )
      ? parsed
      : [];
  }catch{
    return [];
  }
}
/* =========================================================
   ADD RECORD
========================================================= */
function addRecord(
  type,
  data
){
  records.unshift({
    time:
      new Date().toISOString(),
    type:
      type,
    data:
      data
  });
  /*
   * Keep local storage bounded.
   */
  if(
    records.length > 5000
  ){
    records =
      records.slice(
        0,
        5000
      );
  }
  try{
    localStorage.setItem(
      "tk5Records",
      JSON.stringify(
        records
      )
    );
  }catch(error){
    log(
      "localStorage error: " +
      error.message
    );
  }
  renderRecords();
}
/* =========================================================
   RENDER RECORDS
========================================================= */
function renderRecords(){
  const box =
    $("history");
  if(
    records.length === 0
  ){
    box.innerHTML =
      '<div class="small" style="padding:12px 0">' +
      '暂无本地记录' +
      '</div>';
    return;
  }
  box.innerHTML =
    records
      .slice(
        0,
        150
      )
      .map(
        record => {
          return (
            '<div class="record">' +
              '<div>' +
                '<span class="record-title">' +
                escapeHTML(
                  record.type
                ) +
                '</span>' +
                ' · ' +
                escapeHTML(
                  new Date(
                    record.time
                  )
                  .toLocaleString()
                ) +
              '</div>' +
              '<div class="raw">' +
              escapeHTML(
                JSON.stringify(
                  record.data
                )
              ) +
              '</div>' +
            '</div>'
          );
        }
      )
      .join("");
}
/* =========================================================
   ESCAPE
========================================================= */
function escapeHTML(
  value
){
  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}
/* =========================================================
   DOWNLOAD
========================================================= */
function downloadText(
  filename,
  text,
  mime
){
  const blob =
    new Blob(
      [text],
      {
        type:
          mime
      }
    );
  const url =
    URL.createObjectURL(
      blob
    );
  const a =
    document.createElement(
      "a"
    );
  a.href =
    url;
  a.download =
    filename;
  document.body.appendChild(
    a
  );
  a.click();
  a.remove();
  setTimeout(
    () => {
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
}
/* =========================================================
   CSV
========================================================= */
function makeCSV(){
  const rows = [
    [
      "time",
      "type",
      "data"
    ]
  ];
  for(
    const r of records
  ){
    rows.push([
      r.time,
      r.type,
      JSON.stringify(
        r.data
      )
    ]);
  }
  return rows
    .map(
      row =>
        row
          .map(
            value =>
              '"' +
              String(value)
                .replace(
                  /"/g,
                  '""'
                ) +
              '"'
          )
          .join(",")
    )
    .join("\n");
}
/* =========================================================
   BUTTON EVENTS
========================================================= */
$("connect")
  .addEventListener(
    "click",
    connect
  );
$("disconnect")
  .addEventListener(
    "click",
    disconnect
  );
document
  .querySelectorAll(
    "[data-mode]"
  )
  .forEach(
    button => {
      button.addEventListener(
        "click",
        () => {
          startMeasurement(
            Number(
              button.dataset.mode
            )
          );
        }
      );
    }
  );
$("stopMeasure")
  .addEventListener(
    "click",
    stopMeasurement
  );
document
  .querySelectorAll(
    "[data-history]"
  )
  .forEach(
    button => {
      button.addEventListener(
        "click",
        () => {
          queryHistory(
            button.dataset.history
          );
        }
      );
    }
  );
$("copyLog")
  .addEventListener(
    "click",
    async () => {
      try{
        await navigator
          .clipboard
          .writeText(
            logs.join("\n")
          );
        log(
          "日志已复制"
        );
      }catch(error){
        log(
          "复制失败：" +
          error.message
        );
      }
    }
  );
$("clearLog")
  .addEventListener(
    "click",
    () => {
      logs = [];
      $("log")
        .textContent =
        "";
    }
  );
$("clearRecords")
  .addEventListener(
    "click",
    () => {
      const ok =
        confirm(
          "确定清空本机保存的数据？\n\n不会删除戒指里的历史记录。"
        );
      if(!ok){
        return;
      }
      records = [];
      localStorage.removeItem(
        "tk5Records"
      );
      renderRecords();
      log(
        "本地记录已清空"
      );
    }
  );
$("exportJSON")
  .addEventListener(
    "click",
    () => {
      downloadText(
        "tk5-health.json",
        JSON.stringify(
          records,
          null,
          2
        ),
        "application/json;charset=utf-8"
      );
    }
  );
$("exportCSV")
  .addEventListener(
    "click",
    () => {
      downloadText(
        "tk5-health.csv",
        makeCSV(),
        "text/csv;charset=utf-8"
      );
    }
  );
/* =========================================================
   HISTORY STATUS
========================================================= */
function setHistoryStatus(
  text
){
  $("historyStatus")
    .textContent =
    text;
}
/* =========================================================
   INITIAL
========================================================= */
renderRecords();
log(
  "TK5 Health v0.4 loaded"
);
log(
  "Bluefy + Web Bluetooth"
);
log(
  "历史同步状态机已启用"
);
</script>
