<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TK5 Smart Ring</title>
<style>
:root{--gold:#d6b56a;--cyan:#67d9df;--text:#edf5f7;--muted:#8ea3ad;--line:#715f35;--line2:#29404b}
*{box-sizing:border-box}html{background:#050a0e}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#183140 0%,#071018 40%,#050a0e 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto}
.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(17,30,41,.98),rgba(7,15,22,.98));border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 10px 28px rgba(0,0,0,.4)}
h1{margin:0;font-size:18px}h1 span{color:var(--gold);font-size:14px;margin-left:20px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.status{margin-top:10px;padding:8px 12px;border:1px solid var(--line2);border-radius:10px;color:var(--cyan);background:#07141c;font-size:13px;display:flex;align-items:center;gap:8px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;box-shadow:0 0 8px #f59e0b;flex-shrink:0}
.status.connected .status-dot{background:#10b981;box-shadow:0 0 10px #10b981}
.status.disconnected .status-dot{background:#ef4444;box-shadow:0 0 8px #ef4444}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{border:1px solid #35505b;border-radius:12px;padding:12px;background:linear-gradient(145deg,#142733,#0a151d);min-height:86px;position:relative;overflow:hidden}
.m .l{font-size:12px;color:var(--muted)}.m .v{font-size:24px;font-weight:700;margin:6px 0 2px;line-height:1.1}.m .u{font-size:11px;color:var(--muted)}
.m-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--cyan);width:0%;transition:width 0.1s linear}

button{border:1px solid #8b7440;border-radius:10px;padding:10px 14px;background:linear-gradient(145deg,#172933,#101d25);color:var(--text);font-size:13px;transition:border-color .2s, box-shadow .2s}
button:active{filter:brightness(1.12)}
button:disabled{opacity:.4;pointer-events:none}
button.p{background:linear-gradient(135deg,#806a39,#4f4327);color:#fff}
button.c{border-color:#438d91;background:linear-gradient(135deg,#153b41,#10282e)}
button.d{border-color:#7b4141;color:#ffdede}
button.glow{border-color:var(--cyan)!important;box-shadow:0 0 10px var(--cyan)!important}

.hist{max-height:340px;overflow:auto;margin-top:6px}
.rc{background:#0c1820;border:1px solid #2a4550;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px}
.rc .t{color:var(--gold);font-size:12px;margin-bottom:3px}

.chart-box{margin-top:10px;background:#030709;border:1px solid #25343b;border-radius:10px;padding:10px}
.chart-title{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
canvas{width:100%!important;height:100px!important;display:block}

.range-tabs{display:flex;gap:4px;margin-top:2px}
.range-tabs button{flex:1;padding:4px 0;font-size:11px;border-radius:20px}
.range-tabs button.active{background:linear-gradient(135deg,#806a39,#4f4327);color:#fff;border-color:#8b7440}

#log{margin-top:8px;background:#030709;border:1px solid #25343b;color:#9fe9d0;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;padding:10px;border-radius:10px}
</style>
</head>
<body>
<main>
<div id="page1">
<div class="card">
  <h1>TK5 Smart Ring <span>TP制作🐈🎏</span></h1>
  <div class="row" style="margin-top:10px;justify-content:center">
    <button id="btnConnect" class="p">连接</button>

<div class="card">

    <div class="m" id="card-spo2"><div class="l">🩸 血氧</div><div id="spo2" class="v">--</div><div class="u">%</div><div class="m-progress" id="prog-spo2"></div></div>

<div class="card">
  <div class="row">

  <div class="chart-title"><span>💆 压力</span><span id="pressure-chart-sub">暂无数据</span></div>

<script>
"use strict";

const SVC = "be940000-7333-be46-b7ae-689e71722bd5";
const C1U = "be940001-7333-be46-b7ae-689e71722bd5";
const C3U = "be940003-7333-be46-b7ae-689e71722bd5";
const EPOCH = 946684800;

let device = null, c1 = null, c3 = null;
let c1Buf = new Uint8Array(), c3Buf = new Uint8Array();
let logs = [], records = JSON.parse(localStorage.getItem("tk5Records") || "[]");
let histBusy = false, histTimer = null, histType = null, histChunks = [], histReqKey = null, histEchoType = null, histResolve = null;
let measureResolve = null, measureExpectCode = null;
let isMeasuring = false;
let activeTimerInterval = null;

// 音效生成器 (使用 Web Audio API 动态合成短促清脆的点击音，免去外部音频文件加载)
let audioCtx = null;
function playClickSound() {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
    
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  } catch (e) {
    // 忽略音频策略限制
  }
}

// 统一为所有按钮绑定点击光晕与音效
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (btn) {
    playClickSound();
    btn.classList.add("glow");
    setTimeout(() => btn.classList.remove("glow"), 400);
  }
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
// PulseLoop YCBT: live vitals on C3 (06xx), command replies on C1; 0615 = unprompted battery push
const REALTIME_TYPES = new Set([0x0600, 0x0601, 0x0602, 0x0603, 0x0615, 0x040e, 0x0200, 0x020c, 0x0203]);
const HIST_LABELS = {
  "04": "睡眠历史(原始)", "02": "步数历史(原始)", "1a": "血氧历史(原始)",
  "1e": "体温历史(原始)", "2f": "综合(旧,0x2f原始)", "33": "压力历史"
};
const MODE_NAMES = { 0: "心率", 1: "血压", 2: "血氧", 10: "HRV" };
const MODE_CARD_KEYS = { 0: "hr", 1: "bp", 2: "spo2", 10: "hrv" };

const $ = id => document.getElementById(id);

function log(t) {
  const line = `[${new Date().toLocaleTimeString("zh-CN",{hour12:false})}] ${t}`;
  logs.push(line);
  $("log").textContent = logs.join("\n");
  $("log").scrollTop = $("log").scrollHeight;
}

function setStatus(text, type = "connected") {
  const st = $("status");
  if (!st) return;
  st.className = `status ${type}`;
  const span = st.querySelector("span");
  if (span) span.textContent = text;
}

function hex(a) { return Array.from(a).map(x => x.toString(16).padStart(2,"0")).join(" "); }
function cat(a,b) { const o = new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o; }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function ts(b0,b1,b2,b3) {
  return new Date((b0 + b1*256 + b2*65536 + b3*16777216 + EPOCH) * 1000);
}
function fmt(d) { return d.toLocaleString("zh-CN",{hour12:false}); }

function crc16(data) {
  let c = 0xffff;
  for (let i = 0; i < data.length; i++) {
    c ^= data[i] << 8;
    for (let b = 0; b < 8; b++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
  }
  return c;
}

function packet(type, payload = []) {
  const len = 4 + payload.length + 2;
  const p = new Uint8Array(len);
  p[0] = (type >> 8) & 0xff; p[1] = type & 0xff;
  p[2] = len & 0xff; p[3] = (len >> 8) & 0xff;
  p.set(payload, 4);
  const c = crc16(p.slice(0, len - 2));
  p[len-2] = c & 0xff; p[len-1] = (c >> 8) & 0xff;
  return p;
}

function timePayload() {
  const d = new Date(), y = d.getFullYear();
  return new Uint8Array([y&0xff,(y>>8)&0xff, d.getMonth()+1, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds(), d.getDay()===0?6:d.getDay()-1]);
}

async function send(type, payload = []) {
  if (!c1) return;
  const p = packet(type, payload);
  log(`TX 0x${type.toString(16).padStart(4,"0")} [${hex(p)}]`);
  try {
    if (c1.properties.writeWithoutResponse) await c1.writeValueWithoutResponse(p);
    else await c1.writeValue(p);
  } catch (e) { log("TX ERR " + e.message); }
}

function feed(kind, data) {
  let buf = kind === "C1" ? c1Buf : c3Buf;
  buf = cat(buf, new Uint8Array(data));
  while (buf.length >= 4) {
    const total = buf[2] | (buf[3] << 8);
    if (total < 6) { buf = buf.slice(1); continue; }
    if (buf.length < total) break;
    const pkt = buf.slice(0, total);
    buf = buf.slice(total);
    const type = (pkt[0] << 8) | pkt[1];
    const payload = pkt.slice(4, pkt.length - 2);
    const ok = (pkt[pkt.length-2] | (pkt[pkt.length-1] << 8)) === crc16(pkt.slice(0, pkt.length-2));
    log(`RX ${kind} 0x${type.toString(16).padStart(4,"0")} ${ok?"OK":"BAD"} [${hex(payload)}]`);
    handle(type, payload);
  }
  if (kind === "C1") c1Buf = buf; else c3Buf = buf;
}

function add(type, data) {
  records.unshift({ time: new Date().toISOString(), type, data });
  records = records.slice(0, 4000);
  localStorage.setItem("tk5Records", JSON.stringify(records));
  refreshAll();
}

function decodeHR(bytes) {
  const r = [];
  for (let i = 0; i + 6 <= bytes.length; i += 6)
    r.push({ local: fmt(ts(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3])), hr: bytes[i+5] });
  return r;
}
function decodeBP(bytes) {
  const r = [];
  for (let i = 0; i + 8 <= bytes.length; i += 8)
    r.push({ local: fmt(ts(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3])), sys: bytes[i+5], dia: bytes[i+6], hr: bytes[i+7] });
  return r;
}
function decodeAll(bytes) {
  const r = [];
  for (let i = 0; i + 20 <= bytes.length; i += 20)
    r.push({
      local: fmt(ts(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3])),
      hr: bytes[i+6], sys: bytes[i+7], dia: bytes[i+8], spo2: bytes[i+9]
    });
  return r;
}

// 压力历史帧(0x33/0x0534)：每条记录固定28字节 [时间戳4][数据11][补零11][CRC2]，每小时一条整点采样；
// 压力值 = 数据段第10字节(索引9) + 24，已用官方App同日数据逐点核对(5/5条对上4条，1条差1，判断为App端平滑导致)
function decodePressure(bytes) {
  const r = [];
  for (let i = 0; i + 28 <= bytes.length; i += 28) {
    const d = ts(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3]);
    r.push({ local: fmt(d), t: d.getTime(), pressure: bytes[i+13] + 24 });
  }
  return r;
}

// 睡眠帧(0x0513)：每条记录以[af fa][记录总长2 LE]开头，20字节记录头[标记4][起始时间戳4][结束时间戳4][未知8]，
// 之后每8字节一段[阶段标记1(0xf1深/0xf2浅/0xf3REM)][段起始时间戳4][时长秒数2 LE][占位1]；
// 一次同步可能返回多条记录(中途醒来会拆成多条)，需按每条记录自带长度字段切分后逐条解码再合并统计。
function decodeSleep(bytes) {
  if (bytes.length < 20) return null;
  let i = 0;
  let start = null, end = null;
  const segments = [];
  let deepSec = 0, lightSec = 0, remSec = 0;
  let sessionCount = 0;
  while (i + 20 <= bytes.length) {
    const len = bytes[i+2] | (bytes[i+3] << 8);
    if (len < 20) break; // 长度字段异常，安全退出，保留已解出的部分
    const segEnd = Math.min(i + len, bytes.length);
    const sStart = ts(bytes[i+4], bytes[i+5], bytes[i+6], bytes[i+7]);
    const sEnd = ts(bytes[i+8], bytes[i+9], bytes[i+10], bytes[i+11]);
    if (!start || sStart < start) start = sStart;
    if (!end || sEnd > end) end = sEnd;
    for (let j = i + 20; j + 8 <= segEnd; j += 8) {
      // PulseLoop: stage = tag & 0x0F (1=深睡, 2=浅睡, 3=REM); 兼容旧 0xf1/0xf2/0xf3
      const rawTag = bytes[j];
      const stage = rawTag & 0x0f;
      const segStart = ts(bytes[j+1], bytes[j+2], bytes[j+3], bytes[j+4]);
      const durSec = bytes[j+5] | (bytes[j+6] << 8);
      segments.push({ type: rawTag, stage, start: segStart, durSec });
      if (stage === 1 || rawTag === 0xf1) deepSec += durSec;
      else if (stage === 2 || rawTag === 0xf2) lightSec += durSec;
      else if (stage === 3 || rawTag === 0xf3) remSec += durSec;
    }
    sessionCount++;
    i += len;
  }
  if (!start) return null;
  const totalSec = deepSec + lightSec + remSec;
  return {
    start: fmt(start), end: fmt(end),
    deepMin: Math.round(deepSec / 60), lightMin: Math.round(lightSec / 60), remMin: Math.round(remSec / 60),
    totalMin: Math.round(totalSec / 60),
    score: totalSec ? Math.round((deepSec / totalSec) * 100) : 0,
    sessionCount,
    segments
  };
}

function renderHist() {
  const box = $("history");
  if (!box) return;
  const cards = [];
  for (const rec of records) {
    if (rec.type === "all" && rec.data) {
      for (const x of [...rec.data].reverse()) {
        if (!x.sys && !x.hr && !x.spo2) continue;
        cards.push(`<div class="rc"><div class="t">${esc(x.local)}</div><div>${x.sys?`血压 <b>${x.sys}/${x.dia}</b> `:""}${x.hr?`心率 <b>${x.hr}</b> `:""}${x.spo2?`血氧 <b>${x.spo2}</b>%`:""}</div></div>`);
      }
    } else if (rec.type === "bp") {
      cards.push(`<div class="rc"><div class="t">${esc(fmt(new Date(rec.time)))} 实时</div><div>血压 <b>${rec.data.sys}/${rec.data.dia}</b> 心率 <b>${rec.data.hr}</b></div></div>`);
    } else if (rec.type === "spo2") {
      cards.push(`<div class="rc"><div class="t">${esc(fmt(new Date(rec.time)))} 实时</div><div>血氧 <b>${rec.data}</b>%</div></div>`);
    } else if (rec.type === "hr") {
      cards.push(`<div class="rc"><div class="t">${esc(fmt(new Date(rec.time)))} 实时</div><div>心率 <b>${rec.data}</b></div></div>`);
    } else if (rec.type === "hrv") {
      cards.push(`<div class="rc"><div class="t">${esc(fmt(new Date(rec.time)))} 实时</div><div>HRV <b>${rec.data}</b></div></div>`);
    } else if (rec.type === "sleep" && rec.data) {
      const d = rec.data;
      cards.push(`<div class="rc"><div class="t">😴 ${esc(d.start)} ~ ${esc(d.end)}（共${d.totalMin}分钟）</div><div>深睡 <b>${d.deepMin}</b>分 · 浅睡 <b>${d.lightMin}</b>分 · REM <b>${d.remMin}</b>分</div></div>`);
    } else if (rec.type === "pressure" && rec.data) {
      for (const x of [...rec.data].reverse())
        cards.push(`<div class="rc"><div class="t">${esc(x.local)}</div><div>压力 <b>${x.pressure}</b></div></div>`);
    } else if (rec.type === "raw") {
      const d = rec.data;
      cards.push(`<div class="rc"><div class="t">${esc(fmt(new Date(rec.time)))} · ${esc(d.label)} · 帧0x${(d.frameType||0).toString(16).padStart(4,"0")} · ${d.bytes}字节</div><div style="font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;color:var(--cyan)">${esc(d.hex)}</div></div>`);
    }
    if (cards.length >= 40) break;
  }
  box.innerHTML = cards.length ? cards.join("") : "";
}

// ---- 图表通用工具（三个趋势图共用，避免重复的画布初始化/空状态代码）----

const RANGE_DAYS = { day: 1, week: 7, month: 30, year: 365 };
// 三个图表各自独立记住当前选中的时间范围
const chartRange = { trend: "week", sleep: "week", bp: "week", pressure: "day" };

// 压力/睡眠详情页的日期导航状态（默认今天，用‹›切换查看历史某一天）
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function dateLabel(d) { return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,"0")}`; }
let pressureDate = startOfDay(new Date());
let hypnoDate = startOfDay(new Date());

// 按“年/月/周/日”过滤记录：只保留 time 落在最近 N 天内的
function filterByRange(list, range) {
  const cutoff = Date.now() - (RANGE_DAYS[range] || 7) * 86400000;
  return list.filter(r => new Date(r.time).getTime() >= cutoff);
}

// 绑定一组范围选择按钮：点击后更新对应图表的range并重绘
function setupRangeTabs(containerId, chartKey, redraw) {
  const el = $(containerId);
  if (!el) return;
  el.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      chartRange[chartKey] = btn.dataset.range;
      el.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === btn));
      redraw();
    };
  });
}

// 按DPR初始化画布并清空，返回绘图上下文与逻辑宽高
function initCanvas(canvasId) {
  const canvas = $(canvasId);
  if (!canvas) return null;
  const ctx = canvas.getContext("2d");
  if (!ctx) return null;
  const width = canvas.clientWidth || 300;
  const height = 100;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, width, height);
  return { ctx, width, height };
}

function drawEmptyState(ctx, width, height, msg) {
  ctx.fillStyle = "#8ea3ad";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(msg, width / 2, height / 2 + 4);
}

// 单条曲线的面积图（心率趋势 / 睡眠质量共用）
function drawAreaChart(ctx, width, height, points, strokeColor, fillColorRgba, dotColor) {
  const min = Math.min(...points) - 5;
  const max = Math.max(...points) + 5;
  const stepX = width / (points.length - 1);
  const yOf = v => height - ((v - min) / (max - min || 1)) * (height - 20) - 10;

  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, fillColorRgba(0.25));
  grad.addColorStop(1, fillColorRgba(0));

  ctx.beginPath();
  points.forEach((val, i) => (i === 0 ? ctx.moveTo(i * stepX, yOf(val)) : ctx.lineTo(i * stepX, yOf(val))));
  ctx.lineTo(width, height);
  ctx.lineTo(0, height);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  points.forEach((val, i) => (i === 0 ? ctx.moveTo(i * stepX, yOf(val)) : ctx.lineTo(i * stepX, yOf(val))));
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth = 2;
  ctx.stroke();

  points.forEach((val, i) => {
    ctx.beginPath();
    ctx.arc(i * stepX, yOf(val), 3, 0, Math.PI * 2);
    ctx.fillStyle = dotColor;
    ctx.fill();
  });
}

function drawTrendChart() {
  const c = initCanvas("trendCanvas");
  if (!c) return;
  const { ctx, width, height } = c;

  let points = [];
  for (const rec of filterByRange(records, chartRange.trend)) {
    if (rec.type === "hr") points.push(rec.data);
    else if (rec.type === "all" && rec.data) {
      for (const x of rec.data) if (x.hr) points.push(x.hr);
    }
  }
  points = points.reverse().slice(-20);

  const sub = $("chart-sub");
  if (sub) sub.textContent = points.length ? `共 ${points.length} 个样本` : "暂无数据";
  if (points.length < 2) return drawEmptyState(ctx, width, height, "数据较少，多测几次即可生成趋势图");

  drawAreaChart(ctx, width, height, points, "#67d9df", a => `rgba(103, 217, 223, ${a})`, "#d6b56a");
}

function drawSleepChart() {
  const c = initCanvas("sleepCanvas");
  if (!c) return;
  const { ctx, width, height } = c;

  let points = [];
  for (const rec of filterByRange(records, chartRange.sleep)) {
    if (rec.type === "sleep" && typeof rec.data.score === "number") points.push(rec.data.score);
  }
  points = points.reverse().slice(-20);

  const sub = $("sleep-chart-sub");
  if (sub) sub.textContent = points.length ? `共 ${points.length} 个样本` : "暂无数据";
  if (points.length < 2) return drawEmptyState(ctx, width, height, "同步睡眠历史后生成睡眠质量趋势图");

  drawAreaChart(ctx, width, height, points, "#d6b56a", a => `rgba(214, 181, 106, ${a})`, "#67d9df");
}

function drawBPChart() {
  const c = initCanvas("bpCanvas");
  if (!c) return;
  const { ctx, width, height } = c;

  let points = [];
  for (const rec of filterByRange(records, chartRange.bp)) {
    if (rec.type === "bp" && rec.data) points.push({ sys: rec.data.sys, dia: rec.data.dia });
    else if (rec.type === "all" && rec.data) {
      for (const x of rec.data) if (x.sys) points.push({ sys: x.sys, dia: x.dia });
    }
  }
  points = points.reverse().slice(-20);

  const sub = $("bp-chart-sub");
  if (sub) sub.textContent = points.length ? `共 ${points.length} 个样本` : "暂无数据";
  if (points.length < 2) return drawEmptyState(ctx, width, height, "数据较少，多测几次即可生成血压分析图");

  const SYS_LINE = 120, DIA_LINE = 80;
  const min = 40, max = 180;
  const stepX = width / (points.length - 1);
  const yOf = v => height - ((v - min) / (max - min)) * (height - 20) - 10;

  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.lineWidth = 1;

  ctx.strokeStyle = "rgba(214,181,106,0.6)";
  ctx.beginPath();
  ctx.moveTo(0, yOf(SYS_LINE));
  ctx.lineTo(width, yOf(SYS_LINE));
  ctx.stroke();
  ctx.fillStyle = "rgba(214,181,106,0.9)";
  ctx.font = "9px sans-serif";
  ctx.textAlign = "left";
  ctx.setLineDash([]);
  ctx.fillText("120", 2, yOf(SYS_LINE) - 2);

  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = "rgba(103,217,223,0.6)";
  ctx.beginPath();
  ctx.moveTo(0, yOf(DIA_LINE));
  ctx.lineTo(width, yOf(DIA_LINE));
  ctx.stroke();
  ctx.fillStyle = "rgba(103,217,223,0.9)";
  ctx.setLineDash([]);
  ctx.fillText("80", 2, yOf(DIA_LINE) - 2);
  ctx.restore();

  const drawLine = (key, color) => {
    ctx.beginPath();
    points.forEach((pt, i) => {
      const x = i * stepX, y = yOf(pt[key]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
  };
  drawLine("sys", "#d6b56a");
  drawLine("dia", "#67d9df");

  const drawDots = (key, normalColor, limit) => {
    points.forEach((pt, i) => {
      const x = i * stepX, val = pt[key], y = yOf(val);
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = val > limit ? "#ef4444" : normalColor;
      ctx.fill();
    });
  };
  drawDots("sys", "#d6b56a", SYS_LINE);
  drawDots("dia", "#67d9df", DIA_LINE);
}

// 压力柱状图：日视图按0-23整点分桶(压力本身就是整点采样)，周/月/年视图取范围内最近样本
function drawPressureChart() {
  const c = initCanvas("pressureCanvas");
  if (!c) return;
  const { ctx, width, height } = c;

  if ($("pressureDateLabel")) $("pressureDateLabel").textContent = dateLabel(pressureDate);
  if ($("pressureDateNav")) $("pressureDateNav").style.display = chartRange.pressure === "day" ? "" : "none";

  let raw = [];
  if (chartRange.pressure === "day") {
    for (const rec of records) {
      if (rec.type === "pressure" && rec.data) {
        for (const x of rec.data) if (sameDay(new Date(x.t), pressureDate)) raw.push(x);
      }
    }
  } else {
    for (const rec of filterByRange(records, chartRange.pressure)) {
      if (rec.type === "pressure" && rec.data) for (const x of rec.data) raw.push(x);
    }
  }

  const sub = $("pressure-chart-sub");
  if (sub) sub.textContent = raw.length ? `共 ${raw.length} 个样本` : "暂无数据";

  const avgEl = $("pressure-avg"), hiEl = $("pressure-high"), loEl = $("pressure-low");
  if (!raw.length) {
    if (avgEl) avgEl.textContent = "--";
    if (hiEl) hiEl.textContent = "--";
    if (loEl) loEl.textContent = "--";
    return drawEmptyState(ctx, width, height, "同步压力历史后生成趋势图");
  }

  const values = raw.map(x => x.pressure);
  if (avgEl) avgEl.textContent = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
  if (hiEl) hiEl.textContent = Math.max(...values);
  if (loEl) loEl.textContent = Math.min(...values);

  let bars;
  if (chartRange.pressure === "day") {
    bars = new Array(24).fill(null);
    for (const x of raw) bars[new Date(x.t).getHours()] = x.pressure;
  } else {
    bars = raw.slice(-24).map(x => x.pressure);
  }

  const max = 100; // 压力是0-100分值，固定量程与官方App一致
  const barW = width / bars.length;
  bars.forEach((v, i) => {
    if (v === null) return;
    const h = (v / max) * (height - 10);
    ctx.fillStyle = "#67d9df";
    ctx.fillRect(i * barW + barW * 0.2, height - h, barW * 0.6, h);
  });
}

// 睡眠阶段图：用最近一次同步到的睡眠记录的segments画三档柱子(REM最高/浅睡居中/深睡最低)，
// 简化版——官方App是平滑连接的波形图，这里用离散柱子近似同样的"高低起伏"视觉效果，不追求像素级还原
function drawHypnogram() {
  const c = initCanvas("hypnoCanvas");
  if (!c) return;
  const { ctx, width, height } = c;

  const rec = records.find(r => {
    if (r.type !== "sleep" || !r.data || !r.data.segments || !r.data.segments.length) return false;
    const t0 = Math.min(...r.data.segments.map(s => s.start.getTime()));
    return sameDay(new Date(t0), hypnoDate);
  });
  const sub = $("hypno-chart-sub");
  if ($("hypnoDateLabel")) $("hypnoDateLabel").textContent = dateLabel(hypnoDate);

  const setStat = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  if (!rec) {
    if (sub) sub.textContent = "该日期无数据";
    ["hypno-deep","hypno-light","hypno-rem","hypno-total","hypno-awake"].forEach(id => setStat(id, "--"));
    setStat("hypno-start", "--"); setStat("hypno-end", "--");
    $("hypno-analysis") && ($("hypno-analysis").textContent = "");
    return drawEmptyState(ctx, width, height, "这天没有同步到睡眠记录，试试切换日期");
  }

  const d = rec.data;
  if (sub) sub.textContent = fmt(new Date(rec.time));
  setStat("hypno-deep", `${d.deepMin}min`);
  setStat("hypno-light", `${d.lightMin}min`);
  setStat("hypno-rem", `${d.remMin}min`);
  setStat("hypno-total", `${Math.floor(d.totalMin/60)}h${d.totalMin%60}min`);
  setStat("hypno-awake", d.sessionCount > 1 ? d.sessionCount - 1 : 0);

  const segs = d.segments;
  const tMin = Math.min(...segs.map(s => s.start.getTime()));
  const tMax = Math.max(...segs.map(s => s.start.getTime() + s.durSec * 1000));
  setStat("hypno-start", fmt(new Date(tMin)).split(" ").pop().slice(0,5));
  setStat("hypno-end", fmt(new Date(tMax)).split(" ").pop().slice(0,5));

  const analysis = $("hypno-analysis");
  if (analysis) {
    let text = d.totalMin >= 420 ? "睡眠时长充足" : d.totalMin >= 300 ? "睡眠时长一般" : "睡眠时长偏短";
    analysis.textContent = `📈 ${text}（本地粗略估算，非官方算法）`;
  }

  const span = (tMax - tMin) || 1;
  const xOf = t => (t - tMin) / span * width;
  const LEVEL = { 3: { y: height * 0.12, h: height * 0.30, color: "#e8834a" },  // REM：最高
                  2: { y: height * 0.46, h: height * 0.30, color: "#b9a6f2" },  // 浅睡：居中
                  1: { y: height * 0.80, h: height * 0.18, color: "#5b4fd6" } }; // 深睡：最低
  for (const seg of segs) {
    const lvl = LEVEL[seg.stage];
    if (!lvl) continue;
    const x1 = xOf(seg.start.getTime());
    const x2 = xOf(seg.start.getTime() + seg.durSec * 1000);
    ctx.fillStyle = lvl.color;
    ctx.fillRect(x1, lvl.y, Math.max(x2 - x1, 1.5), lvl.h);
  }
}

// 统一刷新：历史列表 + 图表（连接/清空/翻页/新数据到达时调用）
function refreshAll() {
  renderHist();
  drawTrendChart();
  drawSleepChart();
  drawBPChart();
  drawPressureChart();
  drawHypnogram();
}

function handle(type, p) {
  if (histBusy && type !== 0x0580 && type !== histEchoType && !REALTIME_TYPES.has(type)) {
    if (histType === null) histType = type;
    histChunks.push(p);
    return;
  }
  switch (type) {
    case 0x0200:
      // 0x0200 在这颗戒指上恒返回0xfe（已证实不可用），仅为兼容可能支持的其他固件保留解析
      if (p.length > 5 && p[5] <= 100) {
        $("battery").textContent = p[5];
      } else if (p.length === 1 && p[0] <= 100) {
        $("battery").textContent = p[0];
      } else if (p.length > 0 && p[0] === 0xfe) {
        log("电量 0xfe（戒指未就绪，等 06 15 推送或稍后重试）");
      }
      break;
    case 0x020c:
      if (p.length >= 2) {
        const s = p[0] | (p[1] << 8);
        if (s > 0) $("steps").textContent = s;
      }
      break;
    case 0x0600:
      // PulseLoop: live activity push — steps in first 2–4 bytes LE
      if (p.length >= 4) {
        const s32 = p[0] | (p[1] << 8) | (p[2] << 16) | (p[3] << 24);
        if (s32 > 0 && s32 < 200000) $("steps").textContent = s32;
      } else if (p.length >= 2) {
        const s = p[0] | (p[1] << 8);
        if (s > 0 && s < 200000) $("steps").textContent = s;
      }
      break;
    case 0x0615:
      // PulseLoop: unprompted battery push
      if (p.length >= 1 && p[0] <= 100) $("battery").textContent = p[0];
      else if (p.length > 5 && p[5] <= 100) $("battery").textContent = p[5];
      break;
    case 0x0601:
      if (p[0] > 0 && p[0] < 250) {
        $("hr").textContent = p[0];
        add("hr", p[0]);
      }
      break;
    case 0x0602:
      if (p[0] > 0 && p[0] <= 100) {
        $("spo2").textContent = p[0];
        add("spo2", p[0]);
      }
      break;
    case 0x0603:
      if (p.length >= 3 && p[0] > 0 && p[1] > 0) {
        $("bp").textContent = `${p[0]} / ${p[1]}`;
        $("bpHr").textContent = "HR " + p[2];
        add("bp", { sys: p[0], dia: p[1], hr: p[2] });
      } else if (p.length >= 4 && p[3] > 0) {
        const v = p[3];
        $("hrv").textContent = v;
        add("hrv", v);
      }
      break;
    case 0x040e:
      if (measureResolve && p[0] === measureExpectCode) {
        const r = measureResolve; measureResolve = null; measureExpectCode = null;
        r();
      }
      break;
    case 0x0580: {
      // PulseLoop: after 05 80 terminal, MUST ACK with 05 80 {00}
      send(0x0580, [0x00]);
      const buf = histChunks.reduce(cat, new Uint8Array());
      if (histReqKey === "06") add("hrHist", decodeHR(buf));
      else if (histReqKey === "08") add("bpHist", decodeBP(buf));
      else if (histReqKey === "09") add("all", decodeAll(buf));
      else if (histReqKey === "33") add("pressure", decodePressure(buf));
      else if (histReqKey === "04") {
        const sleepData = decodeSleep(buf);
        if (sleepData) {
          add("sleep", sleepData);
          const label = `${Math.floor(sleepData.totalMin/60)}h${sleepData.totalMin%60}m`;
          if ($("sleepMin")) $("sleepMin").textContent = label;
        } else if (buf.length > 0) add("raw", { key: histReqKey, label: HIST_LABELS[histReqKey] || histReqKey, frameType: histType, hex: hex(buf), bytes: buf.length });
      }
      else if (buf.length > 0) {
        add("raw", { key: histReqKey, label: HIST_LABELS[histReqKey] || histReqKey, frameType: histType, hex: hex(buf), bytes: buf.length });
      }
      finishHist();
      break;
    }
  }
}

async function connect() {
  try {
    if (!navigator.bluetooth) throw new Error("需要 Bluefy / Chrome");
    setStatus("选择蓝牙设备中...", "disconnected");
    if (device?.gatt?.connected) try { device.gatt.disconnect(); } catch (_) {}

    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "TK5" }, { namePrefix: "tk5" }],
      optionalServices: [SVC]
    });
    await device.gatt.connect();

    const svc = await device.gatt.getPrimaryService(SVC);
    c1 = await svc.getCharacteristic(C1U);
    c3 = await svc.getCharacteristic(C3U);

    c1.addEventListener("characteristicvaluechanged", e => feed("C1", e.target.value.buffer));
    c3.addEventListener("characteristicvaluechanged", e => feed("C3", e.target.value.buffer));
    await c1.startNotifications();
    await c3.startNotifications();

    device.addEventListener("gattserverdisconnected", () => {
      setStatus("设备已断开连接", "disconnected");
      c1 = c3 = null;
      histBusy = false;
      isMeasuring = false;
      clearActiveProgress();
    });

    setStatus("已连接 · " + (device.name || "TK5"), "connected");

    await send(0x0201, [0x47, 0x46]);
    await send(0x0100, timePayload());
    await send(0x021b);
    await send(0x0200);
    await send(0x0203);
    await send(0x020c);
    await send(0x032f, [0x01, 0x00]);
    await send(0x0309, [0x01, 0x00, 0x02, 0xa0]);

    (async () => {
      isMeasuring = true;
      try {
        await sleep(500);
        await hist("09");
        setStatus("正在测量血压，请保持静止...");
        await measureAndWait(1, 1, 30000, "bp");
        setStatus("正在测量心率...");
        await measureAndWait(0, null, 25000, "hr");
        setStatus("正在测量血氧，请确保手环佩戴正确...");
        await measureAndWait(2, 2, 50000, "spo2");
        setStatus("正在测量 HRV...");
        await measureAndWait(10, 0x0a, 30000, "hrv");
        setStatus("已连接 · " + (device?.name || "TK5") + " (自动流程完成)", "connected");
      } catch (e) {
        log("自动测量流程出错: " + e.message);
        setStatus("已连接 · " + (device?.name || "TK5"), "connected");
      } finally {
        isMeasuring = false;
        clearActiveProgress();
      }
    })();
  } catch (e) {
    setStatus("连接失败: " + e.message, "disconnected");
    isMeasuring = false;
    clearActiveProgress();
  }
}

function disconnect() {
  try { if (device?.gatt?.connected) device.gatt.disconnect(); } catch (_) {}
}

function startActiveProgress(cardKey, durationMs) {
  clearActiveProgress();
  const bar = $(`prog-${cardKey}`);
  if (!bar) return;
  let elapsed = 0;
  const interval = 100;
  activeTimerInterval = setInterval(() => {
    elapsed += interval;
    const percent = Math.min(100, (elapsed / durationMs) * 100);
    bar.style.width = percent + "%";
    if (elapsed >= durationMs) clearActiveProgress();
  }, interval);
}

function clearActiveProgress() {
  if (activeTimerInterval) {
    clearInterval(activeTimerInterval);
    activeTimerInterval = null;
  }
  document.querySelectorAll(".m-progress").forEach(el => el.style.width = "0%");
}

async function measure(mode) {
  if (!c1) return;
  if (mode < 0) {
    clearActiveProgress();
    await send(0x032f, [0x00, 0x00]);
    setStatus("已连接 · " + (device?.name || "TK5"), "connected");
    return;
  }
  await send(0x032f, [0x01, mode]);
}

async function measureAndWait(mode, expectCode, timeoutMs, cardKey) {
  setStatus(`正在测量 ${MODE_NAMES[mode] || "项目"}，请保持佩戴...`);
  startActiveProgress(cardKey, timeoutMs);

  await measure(mode);
  if (expectCode === null) {
    await sleep(timeoutMs);
    clearActiveProgress();
    return;
  }
  await Promise.race([
    new Promise(resolve => { measureExpectCode = expectCode; measureResolve = resolve; }),
    sleep(timeoutMs)
  ]);
  measureResolve = null; measureExpectCode = null;
  clearActiveProgress();
}

function finishHist() {
  clearTimeout(histTimer);
  histBusy = false; histType = null; histChunks = []; histReqKey = null; histEchoType = null;
  document.querySelectorAll("[data-h]").forEach(b => b.disabled = false);
  setStatus("已连接 · " + (device?.name || "TK5"), "connected");
  if (histResolve) { const r = histResolve; histResolve = null; r(); }
}

function hist(key) {
  return new Promise(async (resolve) => {
    if (!c1 || histBusy) { resolve(); return; }
    histBusy = true;
    histType = null;
    histChunks = [];
    histReqKey = key;
    histEchoType = 0x0500 | parseInt(key, 16);
    histResolve = resolve;
    document.querySelectorAll("[data-h]").forEach(b => b.disabled = true);
    setStatus("同步历史数据中…");
    await send(histEchoType);
    histTimer = setTimeout(() => { if (histBusy) finishHist(); }, 12000);
  });
}

document.querySelectorAll("[data-mode]").forEach(b => {
  b.onclick = async () => {
    if (isMeasuring && +b.dataset.mode !== -1) return;

    const mode = +b.dataset.mode;
    if (mode >= 0) {
      isMeasuring = true;
      setStatus(`正在手动测量 ${MODE_NAMES[mode]}...`);
      startActiveProgress(MODE_CARD_KEYS[mode], 30000);
      await measure(mode);
    } else {
      isMeasuring = false;
      clearActiveProgress();
      await measure(mode);
    }
  };
});

$("btnConnect").onclick = connect;
$("btnDisconnect").onclick = disconnect;
$("btnBattery").onclick = () => { send(0x0200); send(0x020c); };
document.querySelectorAll("[data-h]").forEach(b => b.onclick = () => hist(b.dataset.h));
$("btnCopy").onclick = async () => { try { await navigator.clipboard.writeText(logs.join("\n")); } catch(e){} };
$("btnClearLog").onclick = () => { logs = []; $("log").textContent = ""; };

};
$("btnJson").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:"application/json"}));
  a.download = "tk5.json"; a.click();
};

setupRangeTabs("trend-range", "trend", drawTrendChart);
setupRangeTabs("sleep-range", "sleep", drawSleepChart);
setupRangeTabs("bp-range", "bp", drawBPChart);
setupRangeTabs("pressure-range", "pressure", drawPressureChart);

// 用本地已保存的记录回填顶部卡片，避免刷新页面后明明有历史数据却显示"--"（只在还没收到实时数据时补一次）
function hydrateFromRecords() {
  for (const rec of records) {
    if (rec.type === "hr" && $("hr").textContent === "--") $("hr").textContent = rec.data;
    else if (rec.type === "spo2" && $("spo2").textContent === "--") $("spo2").textContent = rec.data;
    else if (rec.type === "bp" && $("bp").textContent === "-- / --") {
      $("bp").textContent = `${rec.data.sys} / ${rec.data.dia}`;
      $("bpHr").textContent = "HR " + rec.data.hr;
    } else if (rec.type === "hrv" && $("hrv").textContent === "--") $("hrv").textContent = rec.data;
    else if (rec.type === "sleep" && $("sleepMin").textContent === "--") {
      const label = `${Math.floor(rec.data.totalMin/60)}h${rec.data.totalMin%60}m`;
      $("sleepMin").textContent = label;
    }
  }
}
hydrateFromRecords();
refreshAll();

const MODES = ["监视", "控制", "数据"];
let panelMode = "监视";
function updatePanels() {
  $("panel-control").style.display = panelMode === "控制" ? "" : "none";
  $("panel-data").style.display = panelMode === "数据" ? "" : "none";
  $("btnCycleMode").textContent = panelMode;
}
$("btnCycleMode").onclick = () => {
  panelMode = MODES[(MODES.indexOf(panelMode) + 1) % MODES.length];
  updatePanels();
};
updatePanels();
