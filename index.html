<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TK5 Health</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#f5f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.card{
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 5px 25px rgba(0,0,0,.08)
}
h1{
  margin:0 0 5px;
  font-size:30px
}
.sub{
  color:#777;
  margin-bottom:20px
}
.status{
  padding:13px;
  border-radius:14px;
  background:#f0f0f2;
  margin-bottom:16px;
  line-height:1.5
}
button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:#111;
  color:white;
  font-size:17px;
  font-weight:600
}
button:active{
  opacity:.7
}
button.secondary{
  margin-top:10px;
  background:#666
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:22px
}
.metric{
  background:#f7f7f8;
  border-radius:18px;
  padding:18px
}
.label{
  color:#777;
  font-size:14px;
  margin-bottom:8px
}
.value{
  font-size:34px;
  font-weight:700
}
.unit{
  font-size:13px;
  color:#777
}
.device{
  margin-top:18px;
  padding:14px;
  background:#f7f7f8;
  border-radius:15px;
  font-size:14px;
  line-height:1.8
}
.log{
  margin-top:18px;
  padding:12px;
  background:#111;
  color:#ddd;
  border-radius:14px;
  font-family:monospace;
  font-size:11px;
  line-height:1.5;
  max-height:260px;
  overflow:auto;
  white-space:pre-wrap
}
.note{
  margin-top:18px;
  color:#777;
  font-size:12px;
  line-height:1.6
}
</style>
</head>
<body>
<div class="card">
<h1>TK5 Health</h1>
<div class="sub">
Smart Ring · v0.3
</div>
<div id="status" class="status">
未连接
</div>
<button id="connect">
连接 TK5 52F5
</button>
<div class="grid">
<div class="metric">
<div class="label">❤️ 心率</div>
<div id="hr" class="value">--</div>
<div class="unit">BPM</div>
</div>
<div class="metric">
<div class="label">🩸 血氧</div>
<div id="spo2" class="value">--</div>
<div class="unit">%</div>
</div>
<div class="metric">
<div class="label">👣 步数</div>
<div id="steps" class="value">--</div>
<div class="unit">steps</div>
</div>
<div class="metric">
<div class="label">🔋 电量</div>
<div id="battery" class="value">--</div>
<div class="unit">%</div>
</div>
</div>
<div class="device">
<div>
设备：
<span id="deviceName">--</span>
</div>
<div>
BLE：
<span id="deviceState">未连接</span>
</div>
<div>
YCBT：
<span id="ycbtState">未启动</span>
</div>
<div>
JL：
<span id="jlState">未连接</span>
</div>
</div>
<button
id="clearLog"
class="secondary">
清除调试日志
</button>
<div id="log" class="log">
TK5 Health v0.3
</div>
<div class="note">
v0.3 重点：
修正 YCBT 步数、电量、综合实时数据解析，并显示原始数据包。
如果血氧没有数字，不代表 BLE 连接失败；
部分 TK5 固件只有在完成一次实际血氧测量后才会上报 SpO₂。
</div>
</div>
<script>
/* =========================================================
   UUID
========================================================= */
const HR_SERVICE =
"heart_rate";
const HR_CHAR =
"heart_rate_measurement";
const YCBT_SERVICE =
"be940000-7333-be46-b7ae-689e71722bd5";
const YCBT_C1 =
"be940001-7333-be46-b7ae-689e71722bd5";
const YCBT_C3 =
"be940003-7333-be46-b7ae-689e71722bd5";
/*
 * JieLi RCSP authentication service
 */
const JL_SERVICE =
"ae00";
const JL_WRITE =
"ae01";
const JL_NOTIFY =
"ae02";
let device = null;
let server = null;
let hrCharacteristic = null;
let c1 = null;
let c3 = null;
let jlWrite = null;
let jlNotify = null;
/* Packet buffers */
let c1Buffer =
new Uint8Array(0);
let c3Buffer =
new Uint8Array(0);
/* Keepalive */
let keepaliveCounter = 0;
let keepaliveTimer = null;
/* =========================================================
   UI
========================================================= */
function setStatus(text){
document.getElementById("status").textContent =
text;
}
function setValue(id,value){
document.getElementById(id).textContent =
value;
}
function log(text){
const box =
document.getElementById("log");
box.textContent +=
"\n" + text;
box.scrollTop =
box.scrollHeight;
}
document
.getElementById("clearLog")
.addEventListener("click",()=>{
document.getElementById("log").textContent =
"Log cleared";
});
/* =========================================================
   HEX
========================================================= */
function hex(bytes){
return Array.from(bytes)
.map(x =>
x.toString(16).padStart(2,"0"))
.join(" ");
}
/* =========================================================
   Sleep
========================================================= */
function sleep(ms){
return new Promise(
resolve => setTimeout(resolve,ms)
);
}
/* =========================================================
   CRC-16
========================================================= */
function crc16(data){
let s = 0xffff;
for(let i=0;i<data.length;i++){
s =
(
((s << 8) & 0xff00) |
((s >> 8) & 0x00ff)
) ^ data[i];
s ^= (s & 0xff) >> 4;
s ^= (s << 12) & 0xffff;
s ^= ((s & 0xff) << 5) & 0xffff;
}
return s & 0xffff;
}
/* =========================================================
   YCBT packet
========================================================= */
function makePacket(type,payload=[]){
const len =
4 + payload.length + 2;
const packet =
new Uint8Array(len);
packet[0] =
(type >> 8) & 0xff;
packet[1] =
type & 0xff;
packet[2] =
len & 0xff;
packet[3] =
(len >> 8) & 0xff;
for(
let i=0;
i<payload.length;
i++
){
packet[4+i] =
payload[i];
}
const crc =
crc16(
packet.slice(0,len-2)
);
packet[len-2] =
crc & 0xff;
packet[len-1] =
(crc >> 8) & 0xff;
return packet;
}
/* =========================================================
   Send YCBT command
========================================================= */
async function sendCommand(
type,
payload=[]
){
if(!c1){
throw new Error(
"YCBT C1 unavailable"
);
}
const packet =
makePacket(
type,
payload
);
log(
"TX " +
type.toString(16).padStart(4,"0") +
"  " +
hex(packet)
);
await c1.writeValueWithoutResponse(
packet
);
}
/* =========================================================
   BLE HR 2A37
========================================================= */
function parseHeartRate(value){
if(
!value ||
value.byteLength < 2
)return;
const flags =
value.getUint8(0);
const is16 =
(flags & 1) !== 0;
let hr;
if(is16){
if(value.byteLength < 3)
return;
hr =
value.getUint16(1,true);
}else{
hr =
value.getUint8(1);
}
if(hr > 0 && hr < 250){
setValue("hr",hr);
}
}
/* =========================================================
   Append BLE fragment
========================================================= */
function appendBuffer(
oldBuffer,
newData
){
const result =
new Uint8Array(
oldBuffer.length +
newData.length
);
result.set(oldBuffer,0);
result.set(
newData,
oldBuffer.length
);
return result;
}
/* =========================================================
   Parse YCBT packet fragments
========================================================= */
function parsePackets(
buffer,
source
){
let offset = 0;
const packets = [];
while(
buffer.length-offset >= 4
){
const len =
buffer[offset+2] |
(buffer[offset+3] << 8);
/*
 * Protect against corrupt data.
 */
if(
len < 6 ||
len > 4096
){
log(
source +
" bad length=" +
len
);
offset++;
continue;
}
if(
buffer.length-offset < len
){
break;
}
const packet =
buffer.slice(
offset,
offset+len
);
packets.push(packet);
offset += len;
}
return {
packets,
rest:
buffer.slice(offset)
};
}
/* =========================================================
   C1
========================================================= */
function handleC1(event){
const data =
new Uint8Array(
event.target.value.buffer
);
log(
"C1 raw " +
hex(data)
);
c1Buffer =
appendBuffer(
c1Buffer,
data
);
const parsed =
parsePackets(
c1Buffer,
"C1"
);
c1Buffer =
parsed.rest;
for(
const packet of parsed.packets
){
handleYcbtPacket(
packet,
"C1"
);
}
}
/* =========================================================
   C3
========================================================= */
function handleC3(event){
const data =
new Uint8Array(
event.target.value.buffer
);
log(
"C3 raw " +
hex(data)
);
c3Buffer =
appendBuffer(
c3Buffer,
data
);
const parsed =
parsePackets(
c3Buffer,
"C3"
);
c3Buffer =
parsed.rest;
for(
const packet of parsed.packets
){
handleYcbtPacket(
packet,
"C3"
);
}
}
/* =========================================================
   YCBT packet decoder
========================================================= */
function handleYcbtPacket(
packet,
source
){
if(packet.length < 6)
return;
const type =
(packet[0] << 8) |
packet[1];
const declaredLength =
packet[2] |
(packet[3] << 8);
const payload =
packet.slice(
4,
packet.length-2
);
log(
source +
" packet " +
type.toString(16).padStart(4,"0") +
" len=" +
declaredLength +
" payload=[" +
hex(payload) +
"]"
);
/* ---------------------------------------------------------
   0x0200 DeviceInfo
--------------------------------------------------------- */
if(type === 0x0200){
/*
 * Confirmed:
 * payload[5] = battery
 */
if(payload.length >= 6){
const battery =
payload[5];
if(
battery >= 0 &&
battery <= 100
){
setValue(
"battery",
battery
);
}
}
}
/* ---------------------------------------------------------
   0x020C NowStep
--------------------------------------------------------- */
if(type === 0x020c){
/*
 * Confirmed:
 *
 * [0..1] steps
 * [2..3] calories
 * [4..5] distance
 */
if(payload.length >= 2){
const steps =
payload[0] |
(payload[1] << 8);
setValue(
"steps",
steps.toLocaleString()
);
log(
"STEP RESULT = " +
steps
);
}
}
/* ---------------------------------------------------------
   0x0225 PowerStats
--------------------------------------------------------- */
if(type === 0x0225){
log(
"POWER STATS = " +
hex(payload)
);
}
/* ---------------------------------------------------------
   0x0600 Sport
--------------------------------------------------------- */
if(type === 0x0600){
log(
"REAL SPORT = " +
hex(payload)
);
}
/* ---------------------------------------------------------
   0x0601 Heart
--------------------------------------------------------- */
if(type === 0x0601){
if(payload.length >= 1){
const hr =
payload[0];
if(
hr > 0 &&
hr < 250
){
setValue(
"hr",
hr
);
}
}
}
/* ---------------------------------------------------------
   0x0602 SpO2
--------------------------------------------------------- */
if(type === 0x0602){
if(payload.length >= 1){
const spo2 =
payload[0];
log(
"SpO2 RESULT = " +
spo2
);
if(
spo2 >= 50 &&
spo2 <= 100
){
setValue(
"spo2",
spo2
);
}
}
}
/* ---------------------------------------------------------
   0x0603 Blood / BP
--------------------------------------------------------- */
if(type === 0x0603){
if(payload.length >= 3){
const sbp =
payload[0];
const dbp =
payload[1];
const hr =
payload[2];
log(
"BP RESULT = " +
sbp +
"/" +
dbp +
" HR=" +
hr
);
if(
hr > 0 &&
hr < 250
){
setValue(
"hr",
hr
);
}
}
}
/* ---------------------------------------------------------
   0x060A Comprehensive
--------------------------------------------------------- */
if(type === 0x060a){
/*
 * Real comprehensive data:
 *
 * 0..2   steps
 * 3..4   distance
 * 5..6   calories
 * 7      HR
 * 8      SBP
 * 9      DBP
 * 10     SpO2
 * 11     respiration
 * 12     temp integer
 * 13     temp decimal
 * 14     wearing
 * 15     battery
 *
 * 16..19 PPI
 *
 * 20     glucose raw
 * 21..22 uric acid
 * 23     cholesterol integer
 * 24     cholesterol decimal
 *
 * Minimum useful packet = 20 bytes.
 */
log(
"060A LENGTH=" +
payload.length
);
/*
 * Ignore warm-up packets
 * that contain no useful sensor values.
 */
if(payload.length >= 20){
const steps =
payload[0] |
(payload[1] << 8) |
(payload[2] << 16);
const hr =
payload[7];
const sbp =
payload[8];
const dbp =
payload[9];
const spo2 =
payload[10];
const respiration =
payload[11];
const wearing =
payload[14];
const battery =
payload[15];
log(
"060A DATA " +
"steps=" + steps +
" hr=" + hr +
" bp=" + sbp + "/" + dbp +
" spo2=" + spo2 +
" resp=" + respiration +
" wearing=" + wearing +
" battery=" + battery
);
/*
 * Steps
 */
if(
steps > 0 ||
hr > 0
){
setValue(
"steps",
steps.toLocaleString()
);
}
/*
 * HR
 */
if(
hr > 0 &&
hr < 250
){
setValue(
"hr",
hr
);
}
/*
 * SpO2
 */
if(
spo2 >= 50 &&
spo2 <= 100
){
setValue(
"spo2",
spo2
);
}
/*
 * Battery:
 * do not overwrite a known value with zero.
 */
if(
battery > 0 &&
battery <= 100
){
setValue(
"battery",
battery
);
}
}
}
/* ---------------------------------------------------------
   0x0613 Wearing
--------------------------------------------------------- */
if(type === 0x0613){
if(payload.length >= 5){
const wearing =
payload[4];
log(
"WEARING = " +
wearing
);
}
}
/* ---------------------------------------------------------
   0x032F Keepalive
--------------------------------------------------------- */
if(type === 0x032f){
log(
"KEEPALIVE RX " +
hex(payload)
);
}
}
/* =========================================================
   JieLi AE02 notification
========================================================= */
function handleJLNotify(event){
const data =
new Uint8Array(
event.target.value.buffer
);
log(
"AE02 RX " +
hex(data)
);
}
/* =========================================================
   JL initialization
========================================================= */
async function startJL(){
try{
const service =
await server.getPrimaryService(
JL_SERVICE
);
jlWrite =
await service.getCharacteristic(
JL_WRITE
);
jlNotify =
await service.getCharacteristic(
JL_NOTIFY
);
await jlNotify.startNotifications();
jlNotify.addEventListener(
"characteristicvaluechanged",
handleJLNotify
);
document.getElementById(
"jlState"
).textContent =
"已监听";
log(
"JL AE02 notifications ready"
);
/*
 * AE01 is the RCSP write channel.
 *
 * Do NOT invent an authentication packet here.
 * We only subscribe to AE02 so the ring can
 * complete its own JieLi authentication if needed.
 */
}catch(error){
document.getElementById(
"jlState"
).textContent =
"不可用";
log(
"JL unavailable: " +
(error.message || error)
);
}
}
/* =========================================================
   Current time
========================================================= */
function makeTimePayload(){
const now =
new Date();
const year =
now.getFullYear();
/*
 * Protocol uses:
 * Mon=0 ... Sun=6
 */
const dow =
(now.getDay() + 6) % 7;
return [
year & 0xff,
(year >> 8) & 0xff,
now.getMonth()+1,
now.getDate(),
now.getHours(),
now.getMinutes(),
now.getSeconds(),
dow
];
}
/* =========================================================
   YCBT initialization
========================================================= */
async function startYCBT(){
try{
document.getElementById(
"ycbtState"
).textContent =
"连接中";
const service =
await server.getPrimaryService(
YCBT_SERVICE
);
c1 =
await service.getCharacteristic(
YCBT_C1
);
c3 =
await service.getCharacteristic(
YCBT_C3
);
/*
 * C1 notifications
 */
await c1.startNotifications();
c1.addEventListener(
"characteristicvaluechanged",
handleC1
);
/*
 * C3 notifications
 */
await c3.startNotifications();
c3.addEventListener(
"characteristicvaluechanged",
handleC3
);
document.getElementById(
"ycbtState"
).textContent =
"已连接";
log(
"YCBT C1/C3 ready"
);
/*
 * 1.
 * GetSupportFunction
 */
await sendCommand(
0x0201,
[0x47,0x46]
);
await sleep(400);
/*
 * 2.
 * Sync time
 */
await sendCommand(
0x0100,
makeTimePayload()
);
await sleep(400);
/*
 * 3.
 * GetChipScheme
 */
await sendCommand(
0x021b,
[]
);
await sleep(400);
/*
 * 4.
 * DeviceInfo
 */
await sendCommand(
0x0200,
[0x47,0x43]
);
/*
 * IMPORTANT:
 *
 * Give JieLi authentication time.
 */
log(
"Waiting 3 seconds for JL authentication..."
);
await sleep(3000);
/*
 * 5.
 * Poll chip scheme again
 */
await sendCommand(
0x021b,
[]
);
await sleep(400);
/*
 * 6.
 * Device name
 */
await sendCommand(
0x0203,
[0x47,0x50]
);
await sleep(400);
/*
 * 7.
 * Device info again
 */
await sendCommand(
0x0200,
[0x47,0x43]
);
await sleep(700);
/*
 * 8.
 * STOP real-time first
 */
await sendCommand(
0x0309,
[0x00,0x00,0x02,0x90]
);
await sleep(400);
/*
 * 9.
 * Background HR every 5 minutes
 */
await sendCommand(
0x010c,
[0x01,0x05]
);
await sleep(300);
/*
 * 10.
 * Background SpO2 every 5 minutes
 */
await sendCommand(
0x0126,
[0x01,0x05]
);
await sleep(300);
/*
 * 11.
 * Current steps
 */
await sendCommand(
0x020c,
[]
);
await sleep(700);
/*
 * 12.
 * Power stats
 */
await sendCommand(
0x0225,
[]
);
await sleep(500);
/*
 * 13.
 * START real-time
 */
await sendCommand(
0x0309,
[0x01,0x00,0x02,0xa0]
);
await sleep(1000);
/*
 * 14.
 * Start keepalive
 */
startKeepalive();
document.getElementById(
"ycbtState"
).textContent =
"已启动";
setStatus(
"TK5 已连接 · 正在读取健康数据"
);
}catch(error){
console.error(error);
log(
"YCBT ERROR: " +
(error.message || error)
);
document.getElementById(
"ycbtState"
).textContent =
"启动失败";
setStatus(
"已连接，但 YCBT 启动失败"
);
}
}
/* =========================================================
   Keepalive
========================================================= */
function startKeepalive(){
if(keepaliveTimer){
clearInterval(
keepaliveTimer
);
}
keepaliveTimer =
setInterval(
async ()=>{
try{
await sendCommand(
0x032f,
[
0x01,
keepaliveCounter & 0xff
]
);
keepaliveCounter =
(
keepaliveCounter + 1
) & 0xff;
}catch(error){
log(
"Keepalive error: " +
error.message
);
}
},
30000
);
}
/* =========================================================
   Main connection
========================================================= */
async function connectTK5(){
try{
if(!navigator.bluetooth){
setStatus(
"当前浏览器不支持 Web Bluetooth，请使用 Bluefy"
);
return;
}
setStatus(
"正在搜索 TK5..."
);
device =
await navigator.bluetooth.requestDevice({
filters:[
{
namePrefix:"TK5"
}
],
optionalServices:[
HR_SERVICE,
YCBT_SERVICE,
JL_SERVICE
]
});
const name =
device.name || "";
document.getElementById(
"deviceName"
).textContent =
name || "TK5";
if(
!name.toUpperCase().startsWith("TK5")
){
setStatus(
"找到的设备不是 TK5"
);
return;
}
setStatus(
"已找到 " +
name +
"，正在连接..."
);
document.getElementById(
"deviceState"
).textContent =
"连接中";
device.addEventListener(
"gattserverdisconnected",
()=>{
setStatus(
"设备已断开"
);
document.getElementById(
"deviceState"
).textContent =
"已断开";
document.getElementById(
"ycbtState"
).textContent =
"已断开";
document.getElementById(
"jlState"
).textContent =
"已断开";
if(keepaliveTimer){
clearInterval(
keepaliveTimer
);
keepaliveTimer =
null;
}
}
);
server =
await device.gatt.connect();
document.getElementById(
"deviceState"
).textContent =
"已连接";
/*
 * Standard HR
 */
try{
const hrService =
await server.getPrimaryService(
HR_SERVICE
);
hrCharacteristic =
await hrService.getCharacteristic(
HR_CHAR
);
hrCharacteristic.addEventListener(
"characteristicvaluechanged",
event => {
parseHeartRate(
event.target.value
);
}
);
await hrCharacteristic.startNotifications();
log(
"Standard Heart Rate 2A37 ready"
);
}catch(error){
log(
"Standard HR unavailable: " +
error.message
);
}
/*
 * IMPORTANT:
 * Subscribe to AE02 BEFORE YCBT handshake.
 */
await startJL();
/*
 * Start YCBT.
 */
await startYCBT();
}catch(error){
console.error(error);
setStatus(
"连接失败：" +
(error.message || error)
);
document.getElementById(
"deviceState"
).textContent =
"连接失败";
}
}
/* =========================================================
   Button
========================================================= */
document
.getElementById("connect")
.addEventListener(
"click",
connectTK5
);
/* =========================================================
   Browser check
========================================================= */
if(!navigator.bluetooth){
setStatus(
"请使用 Bluefy 打开本网页"
);
}
</script>
</body>
</html>
